[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-unittests"
dynamic = ["version"]
description = "Plugins for pytest that go with UCS specific packages."
license = { text = "AGPL-3.0-only" }
requires-python = ">= 3.11"
dependencies = []
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[project.entry-points.pytest11]
univention-unittests-ucr = "univentionunittests.ucr"
univention-unittests-umc = "univentionunittests.umc"
univention-unittests-udm = "univentionunittests.udm"

[tool.setuptools]
packages = ["univentionunittests"]

[tool.setuptools.package-dir]
univentionunittests = "python/univention/unittests"

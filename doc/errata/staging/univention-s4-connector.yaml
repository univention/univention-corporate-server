src: univention-s4-connector
fix: 16.7.0
desc: |
 This update addresses the following issues:
 * Group members that exist only in Samba/AD were not reconciled back into
   UCS during a group sync. The `group_members_sync_from_ucs()` function
   iterated over `s4_members_from_ucs` (which only contains lower-cased DNs)
   and then tested membership against that same set, so the condition was
   always false and the reconciliation block was never reached. The function
   now iterates the raw `s4_members` list instead, restoring the intended
   behaviour.
bug: [60029]

desc: |
 This update addresses the following issue:
 * LDAP access control rules for Radius objects have been optimized to reduce
   the overhead of LDAP access checks. The changes take effect on new
   installations. On existing installations, the updated LDAP access control
   rules can be activated by manually re-running the
   `80univention-radius.inst` join script.

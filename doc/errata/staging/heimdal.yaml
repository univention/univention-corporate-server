desc: |
 This update addresses the following issue:
 * Password changes via PAM could fail in long-running processes (e.g. UMC)
   with high file descriptor usage. Heimdal Kerberos previously relied on the
   `select()` API, which cannot handle file descriptor values >= `FD_SETSIZE`
   (1024). In such situations, Kerberos communication with the KDC could fail,
   leading to misleading errors such as "Authentication token manipulation
   error". The implementation now uses `poll()`, eliminating this limitation
   and improving robustness in long-running services.

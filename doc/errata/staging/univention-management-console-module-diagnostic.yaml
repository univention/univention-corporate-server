src: univention-management-console-module-diagnostic
fix: 8.7.2
desc: |
 This update addresses the following issue:
 * A new System Diagnostic module checks configured UDM UID/GID ranges against
   the applicable Samba idmap configuration. On Member Servers, it checks the
   configured Samba idmap ranges. On AD DCs, it reads the actual allocation
   range from idmap.ldb and reports overlapping or invalid ranges.
bug: [58779]

desc: |
 This update addresses the following issue:
 * A new System Diagnostic module checks the configured UDM UID/GID ranges
   against the Samba `idmap` ranges. It reports invalid or uncovered ranges,
   overlapping Samba ranges, and UDM ranges that overlap Samba's automatically
   allocated `3000000 - 4000000` `idmap.ldb` range.
bug: [58779]

desc: |
 This update addresses the following issues:
 * This update ships a new UMC diagnostic plugin `71_samba_memberOf`
   which checks that the `memberOf` attribute is visibible in the
   output of `univention-s4search` and offers possible measures
   in case that is not the case.
   This errata update is a followup to the knowledge base article
   https://help.univention.com/t/18673 .

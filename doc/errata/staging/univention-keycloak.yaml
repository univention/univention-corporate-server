src: univention-keycloak
fix: 3.8.2
desc: |
 This update addresses the following issues:
 * `univention-keycloak` now supports configuring passkeys (WebAuthn
   passwordless) as an alternative to password authentication. The new
   `passkeys` subcommand enables, disables, configures, and shows the passkey
   settings of a Keycloak realm.
 * The `univention-keycloak scope create` command has been extended to support
   additional OpenID Connect protocol mappers for user attributes, hardcoded
   claims, and custom access token audiences. Client scopes can now also be
   assigned directly to OIDC clients as default or optional scopes.
bug: [60123, 57635]

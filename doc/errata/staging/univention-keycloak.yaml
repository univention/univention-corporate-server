desc: |
 This update addresses the following issue:
 * `univention-keycloak` now supports configuring passkeys (WebAuthn
   passwordless) as an alternative to password authentication. The new
   `passkeys` subcommand enables, disables, configures, and shows the
   passkey settings of a Keycloak realm.

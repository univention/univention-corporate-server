release: "5.2"
version: [7]
scope: ucs_5.2-0-errata5.2-7
src: univention-directory-notifier
fix: 16.7.0
desc: |
 This update addresses the following issue:
 * When the Univention Directory Notifier could not reconnect to the LDAP
   server after an idle timeout or a restart of the LDAP server, it aborted.
   systemd then restarted it, and every abort interrupted all connected
   Univention Directory Listeners, which delayed the replication in the
   domain. The notifier now keeps running and retries the connection until
   the LDAP server is reachable again.
bug: [60195]

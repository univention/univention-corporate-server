desc: |
 This update addresses the following issues:
 * The numbers of system accounts for the total user counts are now ignored in
   the metrics.
 * The `opened` query parameter of the object search was missing from the
   OpenAPI/Swagger schema and is now included.
 * The experimental paginated object search has been enhanced by using LDAP
   Server Side Sorting (SSS) together with either Simple Paged Results (SPR)
   or Virtual List View (VLV). This functionality is intended for evaluation
   only and is not yet supported for production use. It has known limitations
   regarding scalability, process-local pagination state, recovery after LDAP
   server restarts, and VLV additionally requires the LDAP SSSVLV overlay to
   be enabled and configured appropriately.

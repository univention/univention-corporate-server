desc: |
 This update addresses the following issues:
 * The Nubus Prometheus metrics are now consistently prefixed with
   `nubus_`, ensuring clearer namespace separation and easier identification
   in monitoring and alerting configurations. The Nubus Prometheus metrics
   `nubus_users_user_total` and `nubus_settings_license_users_limit_total`
   now include the license key as a label, enabling per-license
   observability.

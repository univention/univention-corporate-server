desc: |
 This update addresses the following issues:
 * The univention-telemetry package is added, which collects telemetry
   metrics from UDM REST API, anonymizes and transforms them to OTLP/JSON
   format and forwards them to Univention's telemetry receiver. The feature
   is disabled by default.

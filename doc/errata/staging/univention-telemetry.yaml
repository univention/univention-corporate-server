desc: |
 This update addresses the following issues:
 * The telemetry sender is now enabled by default. Once a day, the Primary
   Directory Node sends basic information about the installation to
   Univention. For details about the transmitted information, its processing
   at Univention and how to disable the transmission, see
   <https://help.univention.com/t/6701>.

desc: |
 This update addresses the following issues:
 * The SSSD responder sockets could fail to start because UCS manages the
   NSS and PAM responders through the SSSD monitor instead of systemd
   socket activation. This caused systemd to report the system as
   degraded. The conflicting socket units are now disabled,
   and their failed states are cleared.
bug: [58121]

src: univention-samba4
fix: 11.6.2
desc: |
 This update addresses the following issue:
 * Fixed Samba 4 backup handling to avoid unnecessarily updating backup files
   on every run. Previously, the backup script always reset permissions on
   existing backup archives, which changed their file metadata even when
   permissions were already correct. This caused backup software that tracks
   metadata changes (for example, Bareos) to repeatedly include unchanged
   Samba backup archives in system backups. The script now adjusts permissions
   only when required, preventing unnecessary backup churn and reducing backup
   size and runtime in environments that retain many or large Samba backup
   files. (Bug #57409)
bug: [57409]

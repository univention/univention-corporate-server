desc: |
 This update addresses the following issue:
 * The UCR variable `samba4/function/level` now also configures the Samba
   option `ad dc functional level` for the functional levels `2012`,
   `2012_R2` and `2016`. This is required to run a Samba domain controller in
   a domain with a functional level higher than Windows Server 2008 R2.
bug: [57862]

product: ucs
release: "5.2"
version: [7]
scope: ucs_5.2-0-errata5.2-7
src: univention-management-console-module-udm
fix: 12.7.0
desc: |
 This update addresses the following issues:
 * The license import functionality insufficiently validated imported LDIF
   files, allowing arbitrary LDAP objects to be created, modified, or
   replaced. Users with permission to import licenses could exploit this
   vulnerability to bypass LDAP access restrictions, create privileged
   administrator accounts, and potentially gain root access to UCS systems.
   The vulnerability affected license imports through the Univention
   Management Console (UMC), UDM REST API, and command-line interface. The
   license import functionality has been hardened to accept only valid license
   objects, preventing unauthorized LDAP modifications (GHSA-v99c-3wcr-2r5x)
   (CVSS score: 9.4 -
   CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H).
bug: [59114]

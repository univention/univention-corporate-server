desc: |
 This update addresses the following issues:
 * The `univention-guardian-server` package is added. It provides the
   Guardian by running Cerbos as a local policy decision point (PDP)
   in a systemd-managed container bound to localhost and ships a set
   of Cerbos policies. It replaces the previous OPA-based Guardian
   as the policy engine.

desc: |
 This update addresses the following issues:
 * The Guardian server now runs Cerbos version 0.56.0.
   Cerbos 0.56.0 is built with Go 1.27 and updated versions of the x/crypto,
   x/net, x/text and gRPC libraries. This fixes CVE-2026-33818,
   CVE-2026-39821, CVE-2026-46600, CVE-2026-56851, CVE-2026-56853,
   CVE-2026-56854, CVE-2026-56855, CVE-2026-56858, CVE-2026-56859,
   CVE-2026-56860, CVE-2026-56862, CVE-2026-78662, CVE-2026-84303,
   CVE-2026-84304 and CVE-2026-84445.

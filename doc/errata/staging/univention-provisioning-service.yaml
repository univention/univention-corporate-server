src: univention-provisioning-service
fix: 2.1.0
desc: |
 This update addresses the following issue:
 * After the machine password of a UCS system changed, the prefill of the
   Provisioning Service App failed, because its container still used the old
   machine password. A server password change hook now reinitializes the
   Provisioning Service App, so the containers use the new machine password.
bug: [60099]

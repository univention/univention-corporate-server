desc: |
 This update addresses the following issues:
 * A change introduced with UCS 5.2-7 caused disabled user accounts with a
   configured future account expiration date to be re-enabled upon any
   subsequent account modification.
   UDM has been updated to ensure the disabled account state is preserved
   in these scenarios.

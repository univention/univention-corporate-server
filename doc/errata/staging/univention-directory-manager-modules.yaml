fix: 17.5.6
desc: |
 This update addresses the following issues:
 * Fix incorrect handling of policy structures when using multiple UDM API
   versions in the same process. Previously, the policy encoder was
   initialized only once and reused globally, causing all subsequent UDM
   instances to interpret the policies attribute according to the API version
   of the first instance. This could lead to invalid policy data structures
   and inconsistent behavior when mixing API versions.
 * In case of errors in a custom hook or syntax, the path of the file is now
   logged, instead of the placeholder "<string>".
 * The property `mailAlternativeAddress` has been added to the `groups/group`
   UDM module.
 * When a user is locked out, the `krbkdcflag`
   attribute is now adjusted accordingly.

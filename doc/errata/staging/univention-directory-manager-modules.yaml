src: univention-directory-manager-modules
fix: 17.7.3
desc: |
 This update addresses the following issue:
 * User accounts disabled before UCS 5.2-7 could still contain a disabled
   password hash, which was restored during subsequent account modifications.
   Since detecting this state could trigger misleading notifications in the
   Univention Management Console, the password hash is now only restored when
   the user account is explicitly re-enabled. As a consequence, affected
   disabled users now receive a generic authentication failure instead of an
   account-disabled message when attempting to log in via Keycloak.
bug: [60078]

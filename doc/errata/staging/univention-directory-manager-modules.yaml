desc: |
 This update addresses the following issues:
 * Attributes containing distinguished names as values were encoded in a
   different format than the distinguished names of LDAP objects. This could
   lead to errors in the UMC not recognizing the correct item in ComboBox
   widgets. Now the formats have been aligned, all data is now written in the
   standard format.

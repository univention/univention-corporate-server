src: univention-directory-manager-modules
fix: 17.6.8
desc: |
 This update addresses the following issue:
 * The syntax validation for Guardian role values has been relaxed. Role
   identifiers are no longer restricted to the previous `app:namespace:role`
   format, allowing arbitrary role strings to be used.
 * The generation of the `sambaNTPassword` LDAP attribute can now be disabled
   via the UCR variable `password/samba/nthash`. When disabled, existing NT
   hashes are removed during the next password change. Be aware that this
   breaks services relying on NT password hashes, including S4/AD Connector
   password synchronization, Squid NTLM authentication, and RADIUS
   MS-CHAP/NTLM authentication.
bug: [59603, 59607]

desc: |
 This update addresses the following issues:
 * A regression introduced in UCS 5.2-7 caused disabled user accounts with a
   future account expiration date to be unintentionally re-enabled when their
   account properties were modified.
   UDM now preserves the disabled state of affected accounts during subsequent
   modifications.

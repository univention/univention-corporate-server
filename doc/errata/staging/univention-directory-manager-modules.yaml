 This update addresses the following issue:
 * The counts of licensed users, servers, and managed clients are now cached
   on the license object via a cron job. The cached numbers are used to
   improve the performance during UMC startup. Additionally the obsolete
   Licence Version 1, Free For Personal Use Edition, Univention Corporate
   Clients, GPL License, Desktop Virtualization Services has been removed from
   the license evaluation.

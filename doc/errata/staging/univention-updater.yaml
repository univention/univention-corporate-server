product: ucs
release: "5.2"
version: [7]
scope: ucs_5.2-0-errata5.2-7
src: univention-updater
fix: 17.7.4
desc: |
 This update addresses the following issues:
 * The removal of UCS role meta packages is now prevented by a new APT hook.
   Previously, manually removing the `linux-image-amd64` meta package or
   installed kernel images, for example to free up space in `/boot`, could
   also remove UCS role meta packages. As a consequence, subsequent release
   updates or manual `apt-get autoremove` operations could unintentionally
   uninstall essential system components.
 * The command `univention-prune-kernels` now prevents the removal of the
   kernel packages which would remove additional packages depending on them.
 * The release updates now prevents an upgrade if the UCS role packages
   are not installed, which prevents an auto-removal of required packages.
bug: [43613, 58827]

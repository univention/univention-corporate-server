desc: |
 This update addresses the following issues:
 * UMC OIDC now supports the log in with an account
   from an external Identiy Provider in Keycloak.
   These "federated accounts" must provide additional
   information, like a UUID and guardian role strings,
   to be accepted and useful in UMC. As UDM authorization for
   these accounts is based on the roles, this feature requires
   the UDM delegative administration.
bug: [58652]

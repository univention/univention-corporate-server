fix: 14.7.3
desc: |
 This update addresses the following issues:
 * The obsolete UCR variable `umc/server/disable-security-restrictions` has
   been removed. The variable disabled UMC security checks intended to protect
   against XSRF attacks and was originally introduced only for compatibility
   between UCS 4.1 and UCS 4.2 systems. Disabling these protections is no
   longer necessary.
 * A security vulnerability in the Univention Management Console allowed
   attackers to redirect users to external websites after successful
   authentication. An attacker could exploit this vulnerability by crafting a
   malicious login URL that redirects users to an attacker-controlled website,
   potentially facilitating phishing attacks. Unsafe redirections are now
   prevented.

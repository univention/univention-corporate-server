desc: |
 This update addresses the following issues:
 * Fixes an issue where the UMC server does not respect the configured
   timeouts for HTTP requests, which can lead to delays in operations that
   involve communication with external services. It led particularly to
   failures on concurrent OpenID Connect (OIDC) authentication.

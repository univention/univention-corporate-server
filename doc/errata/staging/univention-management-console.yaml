desc: |
 This update addresses the following issue:
 * The UMC server allowed HTTP request header smuggling for the
   `X-UMC-Federated-Account` and `X-UMC-Roles` values, which were used for
   interprocess communication between UMC server and UMC module processes, if
   delegative administration was enabled.

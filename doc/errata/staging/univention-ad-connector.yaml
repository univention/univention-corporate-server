desc: |
 This update addresses the following issues:
 * During password synchroization from Active Directory towards
   UCS, the Kerberos keys will now be synchronized by the
   AD-Connector per default. This results in securer Keytypes
   to be usable in UCS when the password of a user has been
   changed in Active Directory.

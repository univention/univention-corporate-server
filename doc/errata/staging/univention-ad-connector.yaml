desc: |
 This update addresses the following issues:
 * Changing the `sAMAccountName` of a user in AD
   led to a Python traceback in the AD-Connector
   because the post modify functions would still
   use the re-rename DN. This could also cause
   additional issues when later changing the `CN`
   of the object. This update fixes these issues.
bug: [58738]

src: univention-ad-connector
fix: 16.5.4
desc: |
 This update addresses the following issues:
 * `univention-adsearch` only supported LDAPS against port 636,
   but not StartTLS against port 389. Now it also supports the latter.
 * Only consider permitted enctypes when synchronizing Kerberos keys
   from AD supplementalCredentials. This avoids a compatibility issue
   with the new `sha256` and `sha384` hash types generated by Windows
   Server 2025 until we apply the fix for the issue in OpenLDAP.
bug: [57747]

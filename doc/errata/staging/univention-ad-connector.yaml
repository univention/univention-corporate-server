src: univention-ad-connector
fix: 16.3.0
desc: |
 * Introduced a new UCR-Variable,
   `connector/ad/mapping/allow-subtree-ancestors`,
   which, if enabled, allows the synchronization of ancestors of subtrees
   allowed with the UCR-Vs `connector/ad/mapping/allowsubtree/.*/[ad|ucs]`.
   This can make the management of the selective synchronization of
   more complex LDAP DIT structures simpler. Additionally, when this new
   variable is enabled, a resynchronization with one of the
   `resync_object_from_*` scripts will handle the resynchronization of
   ancestors automatically if necessary.
bug: [57979]

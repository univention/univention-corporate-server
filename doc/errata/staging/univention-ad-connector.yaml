src: univention-ad-connector
fix: 16.5.6
desc: |
 This update addresses the following issues:
 * Renaming a user object with umlauts in AD led to a
   connector reject. The update fixes this issues.
 * In the modify operation also move object in UCS if
   position has changed in AD.
 * Ignore order of multi value attributes when checking
   for changed attributes.
 * Avoid unnecessary object mapping before checking for
   changed attributes.
 * Avoid ldap.ALREADY_EXISTS if move target exists in UCS
 * During DN mapping, lookup samaccountname for olddn from adcache.
 * Skip resync of reject for uSNCreated if lower than uSNChanged
 * Add AD reject reason to reject database.
   The reason will be shown in the univention-adconnector-list-rejected tool.
bug: [58793]

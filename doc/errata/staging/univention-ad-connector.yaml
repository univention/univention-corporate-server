product: ucs
release: "5.2"
version: [7]
scope: ucs_5.2-0-errata5.2-7
src: univention-ad-connector
fix: 16.8.3
desc: |
 This update addresses the following issues:
 * When synchronizing group memberships from Active Directory to UCS, the AD
   Connector no longer compares every member against the complete list of the
   current members of the group. This speeds up the synchronization of large
   groups considerably.
 * The password synchronization from Active Directory to UCS no longer fails
   with an `AttributeError` if the password history length
   (`msDS-PasswordHistoryLength` or `pwdHistoryLength`) cannot be read from
   Active Directory, e.g. due to missing permissions of the AD Connector
   account. A password history length of 0 is assumed in that case.
bug: [60165, 59219]

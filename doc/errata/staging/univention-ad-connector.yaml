src: univention-ad-connector
fix: 16.6.5
desc: |
 This update addresses the following issues:
 * The `univention-ad-connector` sets the attribute
   `msDS-SupportedEncryptionTypes` in Active Directory
   during the password synchronization to UCS.
   While this is necessary in environments which use
   bidirectional synchronization,
   this is now disabled for all other synchronization
   configurations.
bug: [59704]

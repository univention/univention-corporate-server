src: univention-appcenter
fix: 11.7.2
desc: |
 This update addresses the following issues:
 * `univention-app upgrade app=version` upgraded to the latest version if the
   specified version was already installed. It now leaves the app unchanged
   and exits successfully. Specifying a version older than the installed one,
   or a version of an app that is not installed, now exits with an error
   code.
 * After upgrading an App whose packages moved from the UCS repository to
   their own repository, for example the Provisioning Service Backend, the
   App Center still showed the old version as installed and offered the
   upgrade again. The App Center now shows the installed version correctly.
bug: [58543, 60019]

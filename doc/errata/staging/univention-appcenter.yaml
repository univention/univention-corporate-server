src: univention-appcenter
fix: 9.0.13-3
desc: |
 This update addresses the following issues:
 * Since Keycloak 26 dropped support for `postgresql-11`, we backported
   `postgresql-15` to UCS 5.0-9. `univention-appcenter` now provides proper
   UCR templates for that.
 * `univention-app update-check` did not report all missing apps during a UCS
   upgrade. Some docker apps may be missed due to working on the wrong cache.
   This has been fixed.
bug: [57779, 57802]

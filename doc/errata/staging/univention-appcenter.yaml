desc: |
 This update addresses the following issue:
 * LDAP access control rules for App Center objects have been optimized to
   reduce the overhead of LDAP access checks. The changes take effect on new
   installations. On existing installations, the updated LDAP access control
   rules can be activated by manually re-running the `30univention-appcenter`
   join script.

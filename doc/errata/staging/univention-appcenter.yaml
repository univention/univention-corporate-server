desc: |
 This update addresses the following issues:
 * The App Center now avoids allocating Docker Compose network
   subnets that overlap with host network interfaces,
   preventing potential routing conflicts.
 * Links in app descriptions and license agreements now open in a
   new browser tab instead of loading inside the App Center iFrame.

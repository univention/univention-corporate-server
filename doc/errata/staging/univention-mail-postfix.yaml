src: univention-mail-postfix
fix: 16.3.0
desc: |
 This update addresses the following issues:
 * During login, it could happen that additional mail
   directories in dovecot containing only the username were
   created. This made it appear to the user as though their
   mail folders were emptied.
   The PAM login configuration for dovecot has been adjusted
   to circumvent this behaviour.
bug: [57976]

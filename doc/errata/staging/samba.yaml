desc: |
 This update addresses the following issues:
 * In environments where the `samba4` app has been configured to
   use `mdb` as backend key value store for the `sam.ldb` database,
   the command `samba-tool domain backup offline` could run into
   a deadlock in case parallel changes to the `sam.ldb` where made,
   e.g. via dynamic DNS updates. That command is used by the script
   `univention-samba4-backup`. This was caused by an interplay of
   three components, the script `samba-tool`, the command `mdb_copy`
   and the process attempting to modify the `sam.ldb`.
   This update avoids this issue by reverting upstream changes made
   for Samba bug 14676 which where introduced there in anticipation
   of `lmdb` version `0.9.26`, which UCS `5.0` doesn't use.

src: univention-base-files
fix: 11.7.2
desc: |
 This update addresses the following issues:
 * Enabling remote syslog reception with the UCR variables
   `syslog/input/tcp` or `syslog/input/relp` generated an invalid rsyslog
   configuration. The rsyslog service did not listen on the configured port
   and log messages from remote systems were lost.
 * The new UCR variable `systemd/journald/ForwardToSyslog` configures whether
   journald forwards log messages to rsyslog. Disabling it avoids storing log
   messages twice, in the journal and in the files below `/var/log/`.
bug: [58591, 60002]

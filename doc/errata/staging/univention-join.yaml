desc: |
 This update addresses the following issue:
 * The version check in univention-join used string concatenation with awk
   numeric comparison, causing incorrect results for version numbers like
   5.0-10 vs 5.0-9. The fix uses dpkg --compare-versions for correct
   Debian version ordering.
bug: [58212]

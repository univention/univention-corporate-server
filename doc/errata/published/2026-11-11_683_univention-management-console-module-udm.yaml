desc: |
 This update addresses the following issue:
 * The permissions of the UMC operation set `udm-syntax` have been corrected
   to allow retrieving individual syntax choices. Previously, users assigned
   this operation set could encounter an authorization error when opening UDM
   forms containing selection fields with more entries than the limit
   configured by the UCR variable `directory/manager/web/sizelimit`.

src: univention-appcenter
fix: 11.3.3
desc: |
 This update addresses the following issues:
 * The Univention App Center update process can now be configured for
   restrictive HTTP proxy environments. The UCR variable
   `appcenter/update/skip-zsync` allows skipping zsync and downloading
   metadata directly via HTTPS. The UCR variable
   `appcenter/update/zsync-timeout` defines a timeout for zsync operations
   before falling back to direct download.

desc: |
 This update addresses the following issues:
 * The Dojo and javascript libraries have been upgraded to the latest version:
   `dojo` from `1.16.3` to `1.17.3`,
   `dgrid` from `1.1.0` to `1.3.3`,
   `dstore` from `1.1.1` to `1.2.1`,
   `dompurify` from `1.0.10` to `2.5.8`,
   `xstyle` from `0.3.2` to `0.3.3`.
   This fixes several security vulnerabilities, such
   as XSS protection in `dgrid.Tree`, mXSS protection in `dompurity`
   (GHSA-mjjq-c88q-qhr6), tampering in `dompurity` (CVE-2024-48910), prototype
   polution in `dojo` (CVE-2021-23450).

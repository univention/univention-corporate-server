desc: |
 This update addresses the following issue:
 * Authentication retry handling in the UMC client has been corrected.
   Previously, under certain authentication failures, the client could
   repeatedly retry authentication until the Python recursion limit was
   reached. The retry logic now performs a limited number of authentication
   attempts before reporting the authentication failure to the caller.

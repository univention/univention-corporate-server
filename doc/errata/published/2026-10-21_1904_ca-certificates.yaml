desc: |
 This update addresses the following issue:
 * TEMP-2026-1: The private keys of eight intermediate certificate
   authorities (CAs) operated by eMudhra have been compromised. An attacker
   with access to these keys can issue certificates for any domain, which UCS
   systems accepted as valid. The root CAs `emSign ECC Root CA - G3` and
   `Comodo AAA Services root`, which these intermediate CAs chain to, have
   been removed from the system trust store.

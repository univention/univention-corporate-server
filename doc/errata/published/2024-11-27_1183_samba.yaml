desc: |
 This update addresses the following issues:
 * The init script `/etc/init.d/samba-ad-dc` has been adjusted
   to explicitly stop `winbindd` and `smbd` processes too and
   also check for pids in their respective process group.
   This can be necessary during package updates, in case the
   `winbind.postinst` and `samba.postinst` scripts start these
   processes separately instead of as child of the main `samba`
   process. This should avoid `/etc/init.d/samba restart` failing with
   error message `NT_STATUS_ADDRESS_ALREADY_ASSOCIATED` in `log.samba`.

src: univention-ad-connector
fix: 16.6.1
desc: |
 This update addresses the following issues:
 * The AD Connector could incorrectly assume that an object was deleted in
   Active Directory due to stale entries in the connector database and
   attempted to restore it. Because the lookup did not verify that the AD
   object was actually marked as deleted, AD rejected the operation (“Trying
   to restore not deleted object”), causing synchronization rejects. The
   restore lookup now only considers objects with `isDeleted=TRUE`, preventing
   unnecessary restore attempts
 * Documentation for the obsolete UCR variable
   `connector/password/service/encoding.` has been removed.
bug: [59113, 59128]

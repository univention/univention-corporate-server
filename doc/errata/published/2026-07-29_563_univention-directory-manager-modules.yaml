desc: |
 This update addresses the following issues:
 * The default authorization role `udm:default-roles:helpdesk-operator` for
   the experimental delegative administration feature was missing read
   permissions for mandatory user properties (username, lastname,
   primaryGroup, unixhome, mailForwardCopyToSelf). This caused errors when
   opening or saving user objects in UMC as a helpdesk operator.

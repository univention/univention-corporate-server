desc: |
 This update addresses the following issues:
 * The Group Policy Management Console was crashing sometimes
   when modifying the user permissions in the Security tab.
   Afterwards, the new created ACLs were malformed, which made
   the policy inaccessible. The code which parses the binary
   structures sent by the Windows client has been corrected.
 * An uninitialized filedescriptor associated with
   hanging `rpcd spoolss` processes is now initialized.

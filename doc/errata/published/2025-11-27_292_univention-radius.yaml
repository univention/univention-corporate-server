desc: |
 This update addresses the following issues:
 * The EAP module configuration setting `tls_min_version` can now be
   adjusted using the new UCR variable `freeradius/conf/tls-min-version`
 * The EAP module configuration setting `cipher_list` can now be
   adjusted using the new UCR variable `freeradius/conf/cipher-list`.
   The format is documented in `man openssl-ciphers`.

fix: 13.5.1
desc: |
 This update addresses the following issue:
 * The counts of licensed users, servers, and managed clients are now cached
   on the license object via a cron job. The cached numbers are used to
   improve the performance during UMC startup.
 * The license initialization will not reset the log levels to `ERROR`
   anymore, which caused that several log messages were dropped in the UMC UDM
   modules.

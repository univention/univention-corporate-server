desc: |
 This update addresses the following issues:
 * The UID User Federation Mapper is now created with the "Always Read
   Value From LDAP" setting enabled by default. This establishes LDAP as
   the single source of truth for UIDs, bypassing Keycloak's local database
   cache on every request.
 * The univention-keycloak script introduces a flag to enable the "Always
   Read Value From LDAP" setting for new User Federation Mappers.

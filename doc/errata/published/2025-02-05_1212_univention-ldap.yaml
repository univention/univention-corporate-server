src: univention-ldap
fix: 16.0.17-6
desc: |
 This update addresses the following issues:
 * OpenLDAP is now configured to use the `sortvals` option for the attributes
   `uniqueMember` and `memberUid`. This improves the performance when
   modifying user or groups in environments with groups with several thousand
   members. The attributes for the `sortvals` option can be configured via the
   UCR variable `ldap/server/sortvals`.

desc: |
 This update addresses the following issue:
 * Printing with iPads could cause CUPS to hang or slow down the print
   dialog. The `pam_krb5` Kerberos authentication step is now skipped in
   the PAM auth stack when the service is `cups`, preventing unnecessary
   Kerberos lookups during CUPS authentication.

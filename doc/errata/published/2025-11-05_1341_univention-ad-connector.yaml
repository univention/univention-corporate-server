fix: 14.0.26
desc: |
 This update addresses the following issues:
 * Changing the `sAMAccountName` of a user in AD
   led to a Python traceback in the AD-Connector
   because the post modify functions would still
   use the re-rename DN. This could also cause
   additional issues when later changing the `CN`
   of the object. This update fixes these issues.
 * Introduced a new UCR-Variable,
   `connector/ad/mapping/allow-subtree-ancestors`,
   which, if enabled, allows the synchronization of ancestors of subtrees
   allowed with the UCR-Vs `connector/ad/mapping/allowsubtree/.*/[ad|ucs]`.
   This can make the management of the selective synchronization of
   more complex LDAP DIT structures simpler. Additionally, when this new
   variable is enabled, a resynchronization with one of the
   `resync_object_from_*` scripts will handle the resynchronization of
   ancestors automatically if necessary.
 * Renaming an OU in Active Directory doesn't trigger `uSNChanged` events
   for child objects, only for the OU object itself. While this is enough
   to let the AD-Connector syncronize subtree renames to UDM/OpenLDAP it
   didn't cause cached DN mappings to be updated in the AD-Connector.
   This could lead to rejects in case child objects where modified in AD
   at a later point in time. The AD-Connector now updates the DN caches
   for subtree objects when a OU is renamed in Active Directroy.

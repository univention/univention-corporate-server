src: univention-debug-python
fix: 14.3.0
desc: |
 This update addresses the following issue:
 * The logformat of `univention.debug` has been made configurable to allow a
   structured format with ISO8601 dates. The old german date format is going
   to be removed in future releases. A new loglevel `TRACE` (equals the value
   5) has been added to `univention.debug`. The library `univention.logging`
   now allows to setup structured logging using the `logfmt` format by
   configuring a `univention.debug` logging handler for the Python stdandard
   library logging system.

src: shim-helpers-amd64-signed
fix: 1+15.8+1~deb10u2
desc: |
 This update addresses the following issues:
 * In order to support Secure Boot in Debian 10 (Buster) ELTS, the SecureBoot
   shim needs to be updated to include the Freexian public certificate which
   was used to sign the ELTS Linux kernel and other packages. This update adds
   that certificate to the shim alongside the Debian public CA, which allows
   to boot both old (signed by Debian) and new (signed by Freexian) packages.

stages:
  - lint
  - build

.lint:
  stage: lint
  image:
    name: $UCSLINT
    entrypoint: [""]
  script:
    - ucslint -j ucslint.xml $base
  artifacts:
    reports:
      junit: ucslint.xml

.deb:
  stage: build
  image: $DEB
  before_script:
    - echo -e "\e[0Ksection_start:$(date +%s):prep[collapsed=true]\r\e[0KPreparing build environment"
    - echo man-db man-db/auto-update boolean false | debconf-set-selections
    - echo 'path-exclude /etc/univention/templates/info/*.info' > /etc/dpkg/dpkg.cfg.d/no-ucr
    - install -m644 .gitlab-ci/git.pref /etc/apt/preferences.d/10git.pref
    - echo "deb [trusted=yes] $APT/$CI_COMMIT_REF_SLUG git main" >"/etc/apt/sources.list.d/$CI_COMMIT_REF_SLUG.list"
    - apt-get -qq update
    - echo -e "\e[0Ksection_end:$(date +%s):prep\r\e[0K"
    - cd $base
    - echo -e "\e[0Ksection_start:$(date +%s):build_dep[collapsed=true]\r\e[0KInstalling build dependencies"
    - apt-get -q --assume-yes build-dep .
    - echo -e "\e[0Ksection_end:$(date +%s):build_dep\r\e[0K"
    - find -exec touch -m -h -c -d "@${SOURCE_DATE_EPOCH:-$(dpkg-parsechangelog -STimestamp)}" {} +
  script:
    - echo -e "\e[0Ksection_start:$(date +%s):build\r\e[0KBuilding binary package"
    - dpkg-buildpackage -uc -us -b --jobs-try=auto
    - echo -e "\e[0Ksection_end:$(date +%s):build\r\e[0K"
    - cd $CI_PROJECT_DIR
    - .gitlab-ci/aptly-upload ${base}_*.changes

drop unused:
  stage: build
  image: $DEB
  before_script:
    - apt-get -qq update; apt-get --assume-yes --no-install-recommends install git
  rules:
  - if: $CI_COMMIT_MESSAGE =~ /skip-build/ || $pipeline =~ /skip-build/
    when: never
  - when: always
  variables:
    GIT_DEPTH: 100
  script:
    - echo -e "\e[0Ksection_start:$(date +%s):find\r\e[0KSearch all unchanged packages"
    - echo "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA"
    - echo "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - echo "$CI_COMMIT_REF_NAME"
    - echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - echo "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - echo -e "\e[0Ksection_end:$(date +%s):find\r\e[0K"
    - |
      find . -maxdepth 4 -type f -path '*/debian/control' | cut -d/ -f2- | sed 's|/debian/control$||' | while read base; do
        if [ -n "$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" -- "$base")" ]; then
          echo "Changes in $base - skip"
        else
          echo -e "\e[0Ksection_start:$(date +%s):drop\r\e[0KDropping binary packages for $base"
          .gitlab-ci/aptly-remove ${base}
          echo -e "\e[0Ksection_end:$(date +%s):drop\r\e[0K"
        fi
      done

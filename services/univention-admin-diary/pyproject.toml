[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-admin-diary"
dynamic = ["version"]
description = "UCS - Univention Admin Diary"
license = "AGPL-3.0-only"
requires-python = ">= 3.11"

dependencies = ["univention-config-registry"]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[project.optional-dependencies]
backend = [
    "sqlalchemy",
]

[tool.setuptools]
packages = ["univention.admindiary"]

[tool.setuptools.package-dir]
"univention.admindiary" = "python/admindiary"

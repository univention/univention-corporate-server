        elif type == 'bootp':
            attr = 'univentionDhcpBootp'
        elif type == 'booting':
            attr = 'univentionDhcpBooting'
        elif type == 'duplicates':
            attr = 'univentionDhcpDuplicates'
        elif type == 'declines':
            attr = 'univentionDhcpDeclines'
        elif type == 'client-updates':

[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-portal"
dynamic = ["version"]
description = "Univention Portal"
license = { text = "AGPL-3.0-only" }
requires-python = ">= 3.11"
dependencies = [
    "filetype",
    "python-ldap",
    "requests",
    "tornado",
    "univention-directory-manager-modules",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[tool.setuptools]
packages = [
    "univention.portal",
    "univention.portal.extensions",
    "univention.portal.handlers",
]

[tool.setuptools.package-dir]
"univention.portal" = "python/univention/portal"

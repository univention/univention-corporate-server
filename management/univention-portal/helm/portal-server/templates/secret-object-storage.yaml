{{- $_ := required "Object Storage credentials have to be supplied, see parameter objectStorage.auth." (coalesce (and .Values.objectStorage.auth.secretAccessKey .Values.objectStorage.auth.accessKeyId) (.Values.objectStorage.auth.existingSecret).name) }}
{{- if not (.Values.objectStorage.auth.existingSecret).name }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ include "nubus-common.secrets.name" (dict "defaultNameSuffix" "object-storage" "context" .) | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
    app.kubernetes.io/component: portal-server
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
stringData:
  accessKey: {{ .Values.objectStorage.auth.accessKeyId | quote }}
  secretKey: {{ .Values.objectStorage.auth.secretAccessKey | quote }}
{{- end }}

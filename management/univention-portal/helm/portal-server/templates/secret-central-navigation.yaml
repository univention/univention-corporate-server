{{- $_ := required "A central-navigation shared secret has to be supplied, see parameter portalServer.centralNavigation." (coalesce .Values.portalServer.centralNavigation.sharedSecret (.Values.portalServer.centralNavigation.existingSecret).name) }}
{{- if (and (not (.Values.portalServer.centralNavigation.existingSecret).name) .Values.portalServer.centralNavigation.enabled ) }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ include "nubus-common.secrets.name" (dict "defaultNameSuffix" "central-navigation" "context" .) | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
    app.kubernetes.io/component: portal-server
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
stringData:
  password: {{ .Values.portalServer.centralNavigation.sharedSecret | quote }}
{{- end }}

name: OrganizationalUnitAdmin
description: Permissions of udm:default-roles:organizational-unit-admin with the default DSL.

tests:
  - name: Reads the LDAP base but cannot change it
    input:
      principals: [ou_admin_bremen, ou_admin_no_context]
      resources: [ldap_base]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:create
        - udm:object:modify
        - udm:object:rename
        - udm:object:remove
        - udm:object:move
    expected:
      - principal: ou_admin_bremen
        resource: ldap_base
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:rename: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
          udm:object:move: EFFECT_DENY
      - principal: ou_admin_no_context
        resource: ldap_base
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:rename: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
          udm:object:move: EFFECT_DENY

  - name: Reads its OU, the OUs below it and the OUs above it
    input:
      principals: [ou_admin_team_bremen]
      resources: [ou_bremen, ou_team_bremen]
      actions:
        - udm:object:search
        - udm:object:read
    expected:
      - principal: ou_admin_team_bremen
        resource: ou_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
      - principal: ou_admin_team_bremen
        resource: ou_team_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW

  - name: Cannot read sibling OUs or other OUs
    input:
      principals: [ou_admin_team_bremen]
      resources: [ou_other_bremen, ou_berlin]
      actions:
        - udm:object:search
        - udm:object:read
    expected:
      - principal: ou_admin_team_bremen
        resource: ou_other_bremen
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
      - principal: ou_admin_team_bremen
        resource: ou_berlin
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY

  - name: With a nested context it sees its OU and the parent, but not the OU of the same name in another branch
    input:
      principals: [ou_admin_de_bremen]
      resources: [ou_de_bremen, ou_bremen, ou_de_berlin, ou_berlin]
      actions:
        - udm:object:search
        - udm:object:read
    expected:
      - principal: ou_admin_de_bremen
        resource: ou_de_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
      - principal: ou_admin_de_bremen
        resource: ou_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
      - principal: ou_admin_de_bremen
        resource: ou_de_berlin
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
      - principal: ou_admin_de_bremen
        resource: ou_berlin
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY


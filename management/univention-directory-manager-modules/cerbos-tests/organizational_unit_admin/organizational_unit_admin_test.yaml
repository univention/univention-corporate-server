        - udm:property:firstname:write
        - udm:property:firstname:readonly
        - udm:property:firstname:writeonly
        - udm:property:firstname:none
        - udm:property:password:writeonly
        - udm:property:guardianRoles:none
        - udm:property:guardianInheritedRoles:none
    expected:
      - principal: ou_admin_bremen
        resource: user_bremen
        actions:
          udm:property:firstname:read: EFFECT_ALLOW
          udm:property:firstname:write: EFFECT_ALLOW

        - udm:object:modify
        - udm:object:remove
    expected:
      - principal: lcm_bremen
        resource: network_default
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_bremen
        resource: dns_host_record
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_bremen
        resource: dns_host_record_primary
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_bremen
        resource: dns_ptr_record
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_no_context
        resource: network_default
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_no_context
        resource: dns_host_record
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_no_context
        resource: dns_host_record_primary
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_no_context
        resource: dns_ptr_record
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_context_of_other_role
        resource: network_default
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_context_of_other_role
        resource: dns_host_record
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
      - principal: lcm_context_of_other_role
        resource: dns_host_record_primary

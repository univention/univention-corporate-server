name: LinuxOuClientManager
description: Permissions of udm:default-roles:linux-ou-client-manager with the default DSL.

tests:
  - name: Reads the LDAP base but cannot change it
    input:
      principals: [lcm_bremen, lcm_no_context]
      resources: [ldap_base]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:create
        - udm:object:modify
        - udm:object:remove
    expected:
      - principal: lcm_bremen
        resource: ldap_base
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
      - principal: lcm_no_context
        resource: ldap_base
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:remove: EFFECT_DENY

  - name: Reads its OU but not other OUs
    input:
      principals: [lcm_bremen]
      resources: [ou_bremen, ou_berlin]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:modify
        - udm:object:create
    expected:
      - principal: lcm_bremen
        resource: ou_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:modify: EFFECT_DENY
          udm:object:create: EFFECT_DENY
      - principal: lcm_bremen
        resource: ou_berlin
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:create: EFFECT_DENY

  - name: Manages linux computers in its OU and below
    input:
      principals: [lcm_bremen]
      resources: [linux_bremen, linux_team_bremen]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:create
        - udm:object:modify
        - udm:object:rename
        - udm:object:remove
        - udm:object:move
        - udm:property:name:read
        - udm:property:name:write
        - udm:property:description:write
        - udm:property:mac:write
        - udm:property:name:none
        - udm:property:name:readonly
        - udm:property:name:writeonly
        - udm:object:report-create
    expected:
      - principal: lcm_bremen
        resource: linux_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:rename: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
          udm:object:move: EFFECT_ALLOW
          udm:property:name:read: EFFECT_ALLOW
          udm:property:name:write: EFFECT_ALLOW
          udm:property:description:write: EFFECT_ALLOW
          udm:property:mac:write: EFFECT_ALLOW
          udm:property:name:none: EFFECT_DENY
          udm:property:name:readonly: EFFECT_DENY
          udm:property:name:writeonly: EFFECT_DENY
          udm:object:report-create: EFFECT_DENY
      - principal: lcm_bremen
        resource: linux_team_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:create: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:rename: EFFECT_ALLOW
          udm:object:remove: EFFECT_ALLOW
          udm:object:move: EFFECT_ALLOW
          udm:property:name:read: EFFECT_ALLOW
          udm:property:name:write: EFFECT_ALLOW
          udm:property:description:write: EFFECT_ALLOW
          udm:property:mac:write: EFFECT_ALLOW
          udm:property:name:none: EFFECT_DENY
          udm:property:name:readonly: EFFECT_DENY
          udm:property:name:writeonly: EFFECT_DENY
          udm:object:report-create: EFFECT_DENY

  - name: Cannot manage linux computers outside its OU
    input:
      principals: [lcm_bremen]
      resources: [linux_berlin, linux_base]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:create
        - udm:object:modify
        - udm:object:rename
        - udm:object:remove
        - udm:object:move
        - udm:property:name:read
        - udm:property:name:write
    expected:
      - principal: lcm_bremen
        resource: linux_berlin
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:rename: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
          udm:object:move: EFFECT_DENY
          udm:property:name:read: EFFECT_DENY
          udm:property:name:write: EFFECT_DENY
      - principal: lcm_bremen
        resource: linux_base
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:rename: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
          udm:object:move: EFFECT_DENY
          udm:property:name:read: EFFECT_DENY
          udm:property:name:write: EFFECT_DENY

  - name: A second context adds its OU
    input:
      principals: [lcm_bremen_berlin]
      resources: [linux_bremen, linux_berlin, linux_base]
      actions:
        - udm:object:read
        - udm:object:modify
        - udm:property:name:write
    expected:
      - principal: lcm_bremen_berlin
        resource: linux_bremen
        actions:
          udm:object:read: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:property:name:write: EFFECT_ALLOW
      - principal: lcm_bremen_berlin
        resource: linux_berlin
        actions:
          udm:object:read: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:property:name:write: EFFECT_ALLOW
      - principal: lcm_bremen_berlin
        resource: linux_base
        actions:
          udm:object:read: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:property:name:write: EFFECT_DENY

  - name: Cannot manage Windows computers or users in its OU
    input:
      principals: [lcm_bremen]
      resources: [windows_bremen, user_bremen]
      actions:
        - udm:object:read
        - udm:object:create
        - udm:object:modify
        - udm:object:remove
    expected:
      - principal: lcm_bremen
        resource: windows_bremen
        actions:
          udm:object:read: EFFECT_DENY
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
      - principal: lcm_bremen
        resource: user_bremen
        actions:
          udm:object:read: EFFECT_DENY
          udm:object:create: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:object:remove: EFFECT_DENY

  - name: Changes only the hosts of groups in its OU, but cannot create, rename, move or remove groups
    input:
      principals: [lcm_bremen]
      resources: [group_bremen]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:modify
        - udm:object:create
        - udm:object:rename
        - udm:object:move
        - udm:object:remove
        - udm:property:name:read
        - udm:property:users:read
        - udm:property:hosts:read
        - udm:property:hosts:write
        - udm:property:name:write
        - udm:property:users:write
        - udm:property:description:write
    expected:
      - principal: lcm_bremen
        resource: group_bremen
        actions:
          udm:object:search: EFFECT_ALLOW
          udm:object:read: EFFECT_ALLOW
          udm:object:modify: EFFECT_ALLOW
          udm:object:create: EFFECT_DENY
          udm:object:rename: EFFECT_DENY
          udm:object:move: EFFECT_DENY
          udm:object:remove: EFFECT_DENY
          udm:property:name:read: EFFECT_ALLOW
          udm:property:users:read: EFFECT_ALLOW
          udm:property:hosts:read: EFFECT_ALLOW
          udm:property:hosts:write: EFFECT_ALLOW
          udm:property:name:write: EFFECT_DENY
          udm:property:users:write: EFFECT_DENY
          udm:property:description:write: EFFECT_DENY

  - name: Cannot access groups outside its OU
    input:
      principals: [lcm_bremen]
      resources: [group_berlin, group_domain_admins]
      actions:
        - udm:object:search
        - udm:object:read
        - udm:object:modify
        - udm:property:hosts:write
    expected:
      - principal: lcm_bremen
        resource: group_berlin
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:property:hosts:write: EFFECT_DENY
      - principal: lcm_bremen
        resource: group_domain_admins
        actions:
          udm:object:search: EFFECT_DENY
          udm:object:read: EFFECT_DENY
          udm:object:modify: EFFECT_DENY
          udm:property:hosts:write: EFFECT_DENY

  - name: Manages networks and DNS records anywhere, also without a context

[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "univention-authorization"
version = "1.3.0"
description = "This package contains the Python 3 modules that implement the authorization utilities of UCS."
license = "AGPL-3.0-only"
requires-python = ">= 3.11"

# Core package has no mandatory dependencies.
# Modules that need heavier libraries are gated behind optional extras.
dependencies = []

[tool.setuptools]
package-dir = {"" = "modules"}
packages = ["univention.authorization"]

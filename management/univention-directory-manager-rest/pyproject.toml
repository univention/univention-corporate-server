[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "univention-directory-manager-rest"
version = "0.0.0"
description = "REST service for UCS Directory Manager"
license = {text = "AGPL-3.0-only" }
requires-python = ">= 3.11"
dependencies = [
    "tornado",
    "Genshi",
    "pycurl",
    "defusedxml",
    "Jinja2",
    "python-mimeparse",
    "setproctitle",
    "uritemplate",
    "python-ldap",
    "requests",
    "prometheus_client",
    "univention-config-registry",
    "univention-debug-python",
    "univention-directory-manager-modules",
    "univention-directory-reports",
    "univention-lib",
    "univention-management-console",
    "univention-management-console-module-udm",
    "univention-python",
]

[dependency-groups]
dev = [
    "requests",
    "pytest",
    "udm-rest-api-client"
]

[project.optional-dependencies]
client = [
    "python-ldap",
    "requests",
    "uritemplate",
]
async-client = [
    "aiohttp",
    "uritemplate",
]

[tool.setuptools]
include-package-data = true
packages = [
    "univention.admin.rest",
    "univention.admin.rest.client",
    "univention.admin.rest.server",
    "univention.admin.rest.templates",
    "univention.admin.rest.www",
    "univention.admin.rest.www.css",
    "univention.admin.rest.www.img",
    "univention.admin.rest.www.js",
    "univention.admin.rest.www.schema",
    "univention.admin.rest.www.swaggerui",
]

[tool.setuptools.package-dir]
"" = "src"
"univention.admin.rest.templates" = "templates"
"univention.admin.rest.www" = "var/www/univention/udm"

[tool.setuptools.package-data]
"univention.admin.rest.templates" = ["*.html", "*.js"]
"univention.admin.rest.www" = ["css/*", "js/*", "img/*", "schema/*", "swaggerui/*"]

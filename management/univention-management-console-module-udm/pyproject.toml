[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-management-console-module-udm"
dynamic = ["version"]
description = "UCS - UMC module for UDM"
license = "AGPL-3.0-only"
requires-python = ">= 3.11"
dependencies = [
    "python-ldap",
    "univention-config-registry",
    "univention-directory-manager-modules",
    "univention-directory-reports",
    "univention-lib",
    "univention-management-console",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[tool.setuptools]
packages = ["univention.management.console.modules.udm"]

[tool.setuptools.package-dir]
"univention.management.console.modules.udm" = "umc/python/udm"

[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-config-registry"
dynamic = ["version"]
description = "Univention Corporate Server Configuration management tool"
license = "AGPL-3.0-only"
requires-python = ">= 3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "lazy-object-proxy",
    "univention-debhelper",
    "univention-python",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[project.scripts]
ldapsearch-decode64 = "univention.ldif:ldif_decode"
ldapsearch-wrapper = "univention.ldif:ldif_unwrap"

[tool.setuptools]
platforms = ["UCS"]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
required_plugins = ["pytest-benchmark", "pytest-cov", "pytest-mock"]
testpaths = ["tests", "python/univention/"]
addopts = "--verbose --showlocals -r sx --cov-config=pyproject.toml --cov=python/univention/ --cov-branch --cov-report=term-missing --cov-report=html:pytest/ --cov-report=xml:coverage.xml --junit-xml=pytest.xml --doctest-modules --tb=native"
markers = ["slow: mark test as slow"]

[tool.coverage.run]
branch = true
source = ["python/"]

[tool.coverage.paths]
lib = [
    "base/univention-config-registry/python/univention/",
    "python/univention/",
    "*/python/univention/",
    "*/dist-packages/univention/",
    "*/site-packages/univention/",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "pytest"

[tool.coverage.xml]
output = "coverage.xml"

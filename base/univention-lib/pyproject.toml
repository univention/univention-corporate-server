[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-lib"
dynamic = ["version"]
description = "UCS - common scripting functions for Python 3 scripts"
license = { text = "AGPL-3.0-only" }
requires-python = ">= 3.11"

dependencies = [
    "univention-config-registry",
    "univention-debug-python",
    "univention-python",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[project.optional-dependencies]
ldap = [
    "python-ldap",
    "dnspython",
]
samba = [
    "univention-lib[ldap]",
    "samba",
]
umc = [
    "Pillow",
    "python-magic",
]
apt = [
    # python-apt is Debian-specific and cannot be installed via pip.
    # Install via: apt-get install python3-apt
]
full = [
    "univention-lib[ldap,samba,umc]",
    "polib",
]

[tool.setuptools]
packages = ["univention.lib"]

[tool.setuptools.package-dir]
"univention.lib" = "python"

[build-system]
requires = ["setuptools >= 64", "python-debian"]
build-backend = "setuptools.build_meta"

[project]
name = "univention-python"
version = "0.0.0"
description = "Univention Python"
license = "AGPL-3.0-only"
requires-python = ">= 3.11"
dependencies = [
    "cracklib",
    "univention-config-registry",
    "univention-debug-python",
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"

[tool.setuptools]
package-dir = { "" = "modules" }

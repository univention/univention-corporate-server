[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-python"
dynamic = ["version"]
description = "Univention Python"
license = "AGPL-3.0-only"
requires-python = ">= 3.11"
dependencies = [
    "cracklib",
    "univention-config-registry",
    "univention-debug-python",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[tool.setuptools]
packages = ["univention"]
package-dir = { "univention" = "modules" }

[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-licence-python"
dynamic = ["version"]
description = "Univention license validation library"
license = { text = "AGPL-3.0-only" }
requires-python = ">= 3.11"
dependencies = [
    "python-ldap",
    "univention-debug-python",
    "univention-python",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[tool.setuptools]
packages = []
include-package-data = false

[tool.setuptools.package-dir]
"univention" = "python/univention"

[tool.pytest.ini_options]
testpaths = ["test.py"]

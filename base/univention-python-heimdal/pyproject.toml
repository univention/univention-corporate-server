[build-system]
requires = [
    "setuptools >= 64",
    "setuptools-scm",
    "pkgconfig",
]
build-backend = "setuptools.build_meta"

[project]
name = "univention-python-heimdal"
dynamic = ["version"]
description = "Heimdal Kerberos Python bindings"
license = "AGPL-3.0-only"
requires-python = ">= 3.11"
dependencies = []
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

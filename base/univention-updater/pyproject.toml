[build-system]
requires = ["setuptools >= 64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# emtpy but present!

[project]
name = "univention-updater"
dynamic = ["version"]
description = "UCS - system upgrading tool"
license = { text = "AGPL-3.0-only" }
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "psutil",
    "python-apt",
    "python-debian",
    "packaging",
    "univention-admin-diary",
    "univention-config-registry",
    "univention-directory-manager-modules",
    "univention-lib",
]
authors = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]
maintainers = [
    { name = "Univention GmbH", email = "packages@univention.de" },
]

[project.urls]
Homepage = "https://www.univention.de/"
Repository = "https://github.com/univention/univention-corporate-server/"
Issues = "https://forge.univention.org/bugzilla/"

[project.scripts]
univention-prune-kernels = "univention.updater.scripts.kernel:main"
updater-statistics = "univention.updater.scripts.statistics:main"
univention-policy-maintenance = "univention.updater.scripts.policy_maintenance:main"
univention-policy-repository-sync = "univention.updater.scripts.policy_repo_sync:main"
univention-policy-set-repository-server = "univention.updater.scripts.policy_repo_server:main"
univention-actualise = "univention.updater.scripts.actualize:main"
univention-repository-create = "univention.updater.scripts.repo_create:main"
univention-repository-update = "univention.updater.scripts.repo_update:main"
univention-updater = "univention.updater.scripts.updater:main"
univention-upgrade = "univention.updater.scripts.upgrade:main"
univention-list-installed-unmaintained-packages = "univention.updater.scripts.list_installed_unmaintained_packages:main"

[tool.setuptools]
platforms = ["UCS"]
packages = ["univention", "univention.updater", "univention.updater.scripts"]
package-dir = { "" = "modules" }

[tool.pytest.ini_options]
required_plugins = ["pytest-cov", "pytest-timeout"]
testpaths = ["tests", "modules/univention/updater", "umc/python/updater"]
addopts = "--verbose --showlocals -r sx --cov=univention/updater/ --cov=modules/univention/updater/ --cov=umc/python/updater/ --cov-branch --cov-report=term-missing --cov-report=html:pytest/ --cov-report=xml:coverage.xml --junit-xml=pytest.xml --doctest-modules"

[tool.coverage.run]
branch = true
source = ["modules/", "umc/python/updater/"]

[tool.coverage.paths]
lib = [
    "base/univention-updater/modules/univention/updater/",
    "modules/univention/updater/",
    "*/modules/univention/updater/",
    "*/dist-packages/univention/updater/",
    "*/site-packages/univention/updater/",
    "univention/updater/",
]
umc = [
    "base/univention-updater/umc/python/updater/",
    "umc/python/updater/",
    "*/umc/python/updater/",
    "*/dist-packages/univention/management/console/modules/updater/",
    "*/site-packages/univention/management/console/modules/updater/",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "pytest"

[tool.coverage.xml]
output = "coverage.xml"

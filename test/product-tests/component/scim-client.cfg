# Tests for the SCIM client.
#
# This job runs all tests for the scim-client. These as all unit tests,
# integration tests against the scim2-server reference implementation,
# integration tests against the Univention scim-server, and integration tests
# against wire.com.
#
# The scim-services repo is cloned and tests are run using the test compose file
# in it, along with the override compose file created specifically for this job.
# The integration tests are configured to use provisioning, UDM REST API and
# keycloak running locally on the machine. The SCIM servers tested against
# (reference or Univention) are started via the compose file.
#
# The exit codes and JUnit XML files of all test runs are collected and the job
# fails or succeeds accordingly in the end.
#
# MAIN_APP_VERSION can be set to select the image tag that is used for all
# images in the compose file (default main). The branch of the repo that is
# cloned can only be configured here (not in Jenkins), but it's only used for
# the compose files, not for the build.

[Global]
jenkins_description: SCIM client tests
logfile: scim-client-tests.log

build_server: Proxmox
jenkins_default_kvm_server: Proxmox

proxmox_node: [ENV:PROXMOX_NODE]
proxmox_bridge: [ENV:PROXMOX_BRIDGE]
proxmox_template: template-ucs-joined-[ENV:TARGET_VERSION]-primary
proxmox_vcpus: 2
proxmox_memory: 4G
proxmox_disk_size: 30G
proxmox_description: scim-client-[ENV:UCS_VERSION]
proxmox_user: [ENV:KVM_USER]

recover: 4

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=public
 ERRATA_UPDATE=public
 UCS_TEST_APPCENTER=false
 SCIM_SERVICES_REPOSITORY=https://git.knut.univention.de/univention/dev/projects/scim/scim-services.git
 # This is the branch of the repo we're cloning. We only need it for the compose
 # files.
 SCIM_SERVICES_BRANCH=main
 IMAGE_TAG=[ENV:MAIN_APP_VERSION]
 PROVISIONING_API_BASE_URL=http://nubus-provisioning-api:7777/
 LDAP_BIND_PASSWORD=univention
 TESTCONF_UDM_USERNAME=Administrator
 TESTCONF_UDM_PASSWORD=univention
 TESTCONF_PROVISIONING_API_ADMIN_PASSWORD=univention
 TESTCONF_KEYCLOAK_BASE_URL=http://keycloak:8180
 TESTCONF_KEYCLOAK_ADMIN_PASSWORD=univention
 TESTCONF_WIRE_COM_SCIM_BEARER_TOKEN=[ENV:TESTCONF_WIRE_COM_SCIM_BEARER_TOKEN]

[primary]
command1:
 . utils.sh && basic_setup
 . utils.sh && add_tech_key_authorized_keys
 install -d -m 0755 /root/artifacts/scim-client /root/test-reports/scim-client
 . product-tests/component/scim-client.sh && initialize_exit_code_files
 . utils.sh && basic_setup_ucs_joined "[SELF_IP]"
 # Remove references to other machines.
 udm computers/domaincontroller_backup remove --ignore_not_exists --remove_referring --dn "cn=backup,cn=dc,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_backup remove --ignore_not_exists --remove_referring --dn "cn=2backup,cn=dc,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_slave remove --ignore_not_exists --remove_referring --dn "cn=slave,cn=dc,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_slave remove --ignore_not_exists --remove_referring --dn "cn=replica,cn=dc,cn=computers,$(ucr get ldap/base)"
 udm computers/memberserver remove --ignore_not_exists --remove_referring --dn "cn=member,cn=memberserver,cn=computers,$(ucr get ldap/base)"
 . utils.sh && import_license
 # Make sure provisioning and keycloak don't yet exist so we can set passwords.
 test "$(ucr get server/role)" = domaincontroller_master && test -z "$(ucr get appcenter/apps/keycloak/status)" && test -z "$(ucr get appcenter/apps/provisioning-service/status)" && test ! -e /etc/keycloak.secret && test ! -e /etc/provisioning-secrets.json
 ucr set repository/online=true repository/online/server=https://updates.software-univention.de
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 LOCAL sleep 120
 . utils.sh && wait_for_reboot
 . utils.sh && run_join_scripts
 . utils.sh && assert_join

command2:
 . utils.sh && switch_app_center
 univention-app update
 univention-install -y git ca-certificates curl docker-compose univention-appcenter-docker
 (umask 077 ; echo -n "univention" > /root/scim-app-password)
 (umask 077 ; echo "univention" > /etc/keycloak.secret)
 (umask 077 ; echo '{"PROVISIONING_API_ADMIN_PASSWORD": "univention"}' > /etc/provisioning-secrets.json)
 # Install provisioning, keycloak, and make sure the UDM REST API is running.
 univention-app install keycloak --noninteractive --username Administrator --pwdfile /root/scim-app-password
 univention-app install provisioning-service --noninteractive --username Administrator --pwdfile /root/scim-app-password
 . utils.sh && run_join_scripts
 . utils.sh && assert_join
 systemctl enable --now univention-directory-manager-rest.service

 # Set up an env file for the tests.
 (umask 077; : > /root/scim-client.env) && chmod 0600 /root/scim-client.env
 printf "export IMAGE_TAG=%q\n" "${IMAGE_TAG:-main}" >> /root/scim-client.env
 printf "export PROVISIONING_API_BASE_URL=%q\n" "$PROVISIONING_API_BASE_URL" >> /root/scim-client.env
 printf "export LDAP_BIND_PASSWORD=%q\n" "$LDAP_BIND_PASSWORD" >> /root/scim-client.env
 printf "export TESTCONF_UDM_USERNAME=%q\n" "$TESTCONF_UDM_USERNAME" >> /root/scim-client.env
 printf "export TESTCONF_UDM_PASSWORD=%q\n" "$TESTCONF_UDM_PASSWORD" >> /root/scim-client.env
 printf "export TESTCONF_PROVISIONING_API_ADMIN_PASSWORD=%q\n" "$TESTCONF_PROVISIONING_API_ADMIN_PASSWORD" >> /root/scim-client.env
 printf "export TESTCONF_KEYCLOAK_BASE_URL=%q\n" "$TESTCONF_KEYCLOAK_BASE_URL" >> /root/scim-client.env
 printf "export TESTCONF_KEYCLOAK_ADMIN_PASSWORD=%q\n" "$TESTCONF_KEYCLOAK_ADMIN_PASSWORD" >> /root/scim-client.env
 printf "export LDAP_HOST=%q\n" "$(ucr get ldap/master)" >> /root/scim-client.env
 printf "export LDAP_BIND_DN=%q\n" "uid=Administrator,cn=users,$(ucr get ldap/base)" >> /root/scim-client.env
 printf "export TESTCONF_UDM_BASE_URL=%q\n" "https://$(ucr get ldap/master)/univention/udm/" >> /root/scim-client.env
 printf "export TESTCONF_WIRE_COM_SCIM_BEARER_TOKEN=%q\n" "$TESTCONF_WIRE_COM_SCIM_BEARER_TOKEN" >> /root/scim-client.env
 . product-tests/component/scim-client.sh && wait_for_dependencies_to_be_available

 git clone --depth 1 --single-branch --branch "$SCIM_SERVICES_BRANCH" "$SCIM_SERVICES_REPOSITORY" /root/scim-services
 # Record the checkout, package versions, and installed apps for diagnostics.
 git -C /root/scim-services rev-parse HEAD > /root/artifacts/scim-commit.txt
 dpkg-query -W > /root/packages-under-test.log
 univention-app info > /root/artifacts/app-versions.txt
 # Pull all necessary images so we don't accidentally build.
 . product-tests/component/scim-client.sh && pull_images

command3:
 . product-tests/component/scim-client.sh && start_and_wait_for_reference_server
 . product-tests/component/scim-client.sh && maybe_run_tests_against_reference
 . product-tests/component/scim-client.sh && maybe_run_tests_against_wire_com
 # Stop, but do not remove, the reference container so the port becomes free
 # again for the next run with the Univention server (they bind the same one).
 docker stop scim-server-reference
 . product-tests/component/scim-client.sh && start_and_wait_for_univention_server
 . product-tests/component/scim-client.sh && maybe_run_tests_against_univention

command4:
 install -d -m 0755 /root/artifacts/scim-client /root/test-reports/scim-client
 . product-tests/component/scim-client.sh && copy_test_results_and_logs
 . utils.sh && prepare_results
 LOCAL . product-tests/component/scim-client.sh && remove_old_local_results "[SELF]"
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
 LOCAL . product-tests/component/scim-client.sh && check_local_test_results "[SELF]"

files:
 ~/ec2/license/license.secret /etc/

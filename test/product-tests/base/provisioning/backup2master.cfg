[Global]
jenkins_description: Provisioning setup on one master and one backup standalone and run backup2master.
logfile: provisioning-backup2master.log

kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_extra_label: [ENV:JOB_BASE_NAME]-[ENV:UCS_VERSION]
kvm_operating_system: [ENV:KVM_OPERATING_SYSTEM]
kvm_template: [ENV:KVM_TEMPLATE]
kvm_ucsversion: [ENV:UCS_VERSION]
kvm_architecture: amd64
kvm_memory: [ENV:KVM_MEMORY]
kvm_vcpus: [ENV:KVM_CPUS]
kvm_dhcp: true
recover: 1

# Openstack settings
openstack_flavor_name: UNIVENTION-2V-8-20s

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 SCOPE=[ENV:SCOPE]

[master]
kvm_operating_system: Others
kvm_template: ucs-joined-master
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-primary-joined
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined "[ENV:master_IP]"
 . utils.sh && import_license
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 . utils.sh && jenkins_updates
 udm computers/memberserver remove --remove_referring --dn "cn=member,cn=memberserver,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_slave remove --remove_referring --dn "cn=slave,cn=dc,cn=computers,$(ucr get ldap/base)"
command3:
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
command4:
 . utils.sh && switch_to_test_app_center || :
 echo -n univention > /tmp/univention
 univention-app install --noninteractive --username Administrator --pwdfile /tmp/univention provisioning-service
 . utils.sh && assert_join
command5:
 # install provisioning service on backup
command6:
 # install tests
 ASYNC . utils.sh && install_from_errata_test ucs-test ucs-test-provisioning
command7:
 # run test on master
 . utils.sh && run_minimal_tests -s provisioning
command8:
 # run test on backup1
command9:
 # run test on backup2
command10:
 univention-app logs keycloak || :
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
command11:
 nohup poweroff &
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/

[backup]
kvm_operating_system: Others
kvm_template: ucs-joined-backup
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-backup-joined
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined "[ENV:master_IP]"
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 ASYNC . utils.sh && jenkins_updates
command3:
 . utils.sh && run_join_scripts
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils.sh && switch_to_test_app_center || :
 . utils.sh && assert_join
command4:
 # install provisioning service on master
command5:
 . utils.sh && switch_to_test_app_center || :
 echo -n univention > /tmp/univention
 univention-app install --noninteractive --username Administrator --pwdfile /tmp/univention provisioning-service
 . utils.sh && assert_join
command6:
 # install tests
 ASYNC . utils.sh && install_from_errata_test ucs-test ucs-test-provisioning
command7:
 # run tests on master
command8:
 # run test on backup1
 #. utils.sh && run_minimal_tests -s provisioning
command9:
 # run test on backup2
command10:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
command11:
 # shutdown master
command12:
 for ((i=0;i<50;i++)); do ping -q -c 1 '[master_IP]' || break; sleep 10; done; true
 . utils.sh && rotate_logfiles
 yes '' | for x in /root/univention-backup2master /usr/lib/univention-ldap/univention-backup2master; do [ -x "$x" ] && exec "$x" -w 0; done

 ucr search --brief --non-empty --key ^nameserver ^dns/forwarder | awk -F ': ' '$2 == "[master_IP]" {print $1}' | xargs -r ucr unset
 ucr search --brief --non-empty --key '/master.$(ucr get domainname)$' | cut -d: -f1 | xargs -r ucr unset
 ucr search --brief --non-empty --value '^[master_IP]$' | sed -ne "s/: .*\$/=[backup_IP]/p" | xargs -r ucr set
 ucr search --brief --non-empty --value '^master.$(ucr get domainname)$' | sed -ne "s/: .*\$/=backup.$(ucr get domainname)/p" | xargs -r ucr set
 udm dns/host_record list --filter a='[master_IP]' | sed -ne 's/^DN: //p' | xargs -rn1 udm dns/host_record modify --remove a='[master_IP]' --dn

 . utils.sh && do_reboot
 LOCAL sleep 120
 . utils.sh && wait_for_reboot
command13:
 # reinitialize provisioning-service on backup2
command14:
 # run test on new master
 . utils.sh && run_minimal_tests -s provisioning
command15:
 # run test on backup2 after backup2master
command16:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]

files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/


[backup2]
kvm_operating_system: Others
kvm_template: ucs-joined-backup2
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-backup2-joined
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined "[ENV:master_IP]"
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 ASYNC . utils.sh && jenkins_updates
command3:
 . utils.sh && run_join_scripts
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils.sh && switch_to_test_app_center || :
 . utils.sh && assert_join
command4:
 # install provisioning service on master
command5:
 . utils.sh && switch_to_test_app_center || :
 echo -n univention > /tmp/univention
 univention-app install --noninteractive --username Administrator --pwdfile /tmp/univention provisioning-service
 . utils.sh && assert_join
command6:
 # install tests
 ASYNC . utils.sh && install_from_errata_test ucs-test ucs-test-provisioning
command7:
 # run tests on master
command8:
 # run test on backup1
command9:
 # run test on backup2
 # . utils.sh && run_minimal_tests -s provisioning
command10:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
command11:
 # shutdown master
command12:
 # run backup2master on backup1
command13:
 ucr set ldap/master=backup.$(ucr get domainname)
 univention-app reinitialize provisioning-service
command14:
 # run test on new master
command15:
 . utils.sh && run_minimal_tests -s provisioning
command16:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]

files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/
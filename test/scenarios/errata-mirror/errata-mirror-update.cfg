#
# Checks that the released errata packages install from a mirror of the UCS
# repository (MIRROR), on a VM from the joined primary template. That template
# is rebuilt every night with the published errata, so before an erratum is
# published its erratalevel is the previous one.
# Replaces the manual test of the errata release: pre/post package lists, a
# univention-upgrade, and a check that one binary of every released source is
# installed at the released version.
#
# Variables, set by the Jenkins job ErrataMirrorTest:
#   MIRROR                repository server: http://univention-repository.knut.univention.de/
#                         before update_mirror, https://updates.software-univention.de/ after it
#   PACKAGES              comma separated src=version list, with univention-errata-level=X.Y.Z-EID

[Global]
logfile: errata-mirror-update.log

kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_extra_label: errata-mirror-[ENV:UCS_VERSION]
kvm_operating_system: Others
kvm_ucsversion: [ENV:KVM_UCSVERSION]
kvm_architecture: amd64
kvm_dhcp: true

# Proxmox settings
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_bridge: [ENV:PROXMOX_BRIDGE]
proxmox_template: template-ucs-joined-[ENV:TARGET_VERSION]-primary
proxmox_vcpus: 2
proxmox_memory: 4G
proxmox_disk_size: 30G
proxmox_description: errata-mirror-[ENV:UCS_VERSION]
proxmox_user: [ENV:KVM_USER]

recover: 2

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 TARGET_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 MIRROR=[ENV:MIRROR]
 PACKAGES=[ENV:PACKAGES]

[errata-mirror]
# The checker is copied from the agent (~/ec2/scripts), as the other scripts that are not in this repo.
files:
 ~/ec2/scripts/check_released_packages.py /root/
command1:
 . utils.sh && basic_setup
 . utils.sh && add_tech_key_authorized_keys
 ucr set repository/online/server='[ENV:MIRROR]'
 apt-get update
 mkdir -p /root/test-reports
 dpkg --list > /root/test-reports/pre.txt
 # Not interactive, no app updates, and no newer release: only the errata of this release.
 univention-upgrade --ignoressh --ignoreterm --noninteractive --disable-app-updates --updateto [ENV:UCS_VERSION]
 dpkg --audit
 dpkg --list > /root/test-reports/post.txt
 diff -u /root/test-reports/pre.txt /root/test-reports/post.txt | grep ^+ > /root/test-reports/changes.txt || true
 # exit 1 means a package does not match: the result is in the JUnit report, so the section does not fail.
 # any other exit code (2 for a bad argument, or a crash) still fails the section.
 python3 /root/check_released_packages.py '[ENV:PACKAGES]' --junit /root/test-reports/errata-mirror.xml || [ $? -eq 1 ]
command2:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP]

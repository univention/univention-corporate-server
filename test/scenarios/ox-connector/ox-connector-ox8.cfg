[Global]
logfile: ox-connector-ox8.log
jenkins_description: OX Connector and OX App Suite (Version 8 on k8s) on two ucs hosts

kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_extra_label: [ENV:JOB_BASE_NAME]-[ENV:UCS_VERSION]

kvm_operating_system: UCS
kvm_template: generic-unsafe
kvm_ucsversion: [ENV:UCS_VERSION]
kvm_architecture: amd64

kvm_dhcp: 1
kvm_interface: eth0
kvm_memory: 6GiB
kvm_vcpus: [ENV:KVM_CPUS]

parallel: false

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 MAIN_APP=ox-connector
 MAIN_APP_VERSION=[ENV:MAIN_APP_VERSION]
 MAIL_DOMAIN=lab.test
 APP_DOCKER_IMAGE=[ENV:APP_DOCKER_IMAGE]

[pdn]
kvm_memory: 8G
kvm_vcpus: 4
profile:
 hostname="primary"
 domainname="ucs.test"
 windows/domain="UCS"
 ldap/base="dc=ucs,dc=test"
 ssl/email="ssl@ucs.test"
 timezone="Europe/Berlin"
 locale/default="de_DE.UTF-8:UTF-8"
 root_password="univention"
 server/role="domaincontroller_master"
 interfaces/eth0/type="dhcp"
 packages_install=""
# join ucs
command1:
 PUT /setup/ssh_ansible_key.pub /root/.ssh/authorized_keys
 chmod 600 /root/.ssh/authorized_keys
 . utils.sh && basic_setup
 . utils.sh && rotate_logfiles
 . utils.sh && jenkins_updates
 . utils.sh && run_setup_join
 . utils.sh && assert_join
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 . utils.sh && import_license
 . utils.sh && set_administrator_password_for_ucs_test univention
 univention-install -y univention-appcenter-dev
 univention-app dev-use-test-appcenter

command2:
 echo univention > /tmp/pw
 test "[ENV:COMPONENT_VERSION]" = "public" || . utils.sh && switch_to_test_app_center || true
 ASYNC . utils.sh && install_docker_app_from_branch "$MAIN_APP" "$APP_DOCKER_IMAGE" DEFAULT_CONTEXT="10" OX_IMAP_SERVER="https://as8.lab.test" OX_MASTER_ADMIN="$OX_MASTER_ADMIN" OX_MASTER_PASSWORD="$OX_MASTER_PASSWORD" OX_ENABLE_DEPUTY_PERMISSIONS="true" 

 ucr set hosts/static/[ENV:ox_IP]="as8.lab.test"
 curl -k https://[ENV:ox_IP]/ucs-root-ca.crt -o /usr/local/share/ca-certificates/ox-app-suite.crt
 update-ca-certificates
 docker cp /usr/local/share/ca-certificates/. "$(ucr get appcenter/apps/ox-connector/container):/usr/local/share/ca-certificates/"
 univention-app update-certificates ox-connector
 univention-app shell ox-connector sh -c 'echo "[ENV:ox_IP] as8.lab.test" >> /etc/hosts'
 udm mail/domain create --ignore-exists --position cn=mail,dc=ucs,dc=test --set name="$MAIL_DOMAIN"
 OX_MASTER_PASSWORD="$(cat OX_MASTER_PASSWORD)"
 OX_MASTER_ADMIN="$(cat OX_MASTER_ADMIN)"
 univention-app shell ox-connector python3 -c "from univention.ox.soap.config import save_context_admin_password; save_context_admin_password('10', '$OX_MASTER_ADMIN', '$OX_MASTER_PASSWORD')"
 udm oxmail/oxcontext create --ignore-exists --position cn=open-xchange,dc=ucs,dc=test --set name=default --set contextid=10 

[ox]
kvm_memory: 32G
kvm_vcpus: 8
profile:
 hostname="as8"
 domainname="ox.test"
 windows/domain="ox"
 ldap/base="dc=ox,dc=test"
 ssl/email="ssl@ox.test"
 timezone="Europe/Berlin"
 locale/default="de_DE.UTF-8:UTF-8"
 root_password="univention"
 server/role="domaincontroller_master"
 interfaces/eth0/type="dhcp"
 packages_install=""
# join ucs
command1:
 PUT /setup/ssh_ansible_key.pub /root/.ssh/authorized_keys
 chmod 600 /root/.ssh/authorized_keys
 . utils.sh && basic_setup
 . utils.sh && run_setup_join
 . utils.sh && assert_join
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 . utils.sh && set_administrator_password_for_ucs_test univention
 # install k8s (kind), k9s, kubectl and ox8
 bash /root/install_ox8.sh
 # get secrets
 OX_MASTER_ADMIN="$(kubectl get secrets as8-core-mw-secret-envvars -n as8  -o jsonpath='{.data.MASTER_ADMIN_USER}'|base64 -d)"
 OX_MASTER_PASSWORD="$(kubectl get secrets as8-core-mw-secret-envvars -n as8  -o jsonpath='{.data.MASTER_ADMIN_PW}'|base64 -d)"
 echo "$OX_MASTER_ADMIN" > OX_MASTER_ADMIN
 echo "$OX_MASTER_PASSWORD" > OX_MASTER_PASSWORD
 echo univention > /tmp/pw
 univention-scp /tmp/pw  OX_MASTER_ADMIN root@[pdn_IP]:
 univention-scp /tmp/pw  OX_MASTER_PASSWORD root@[pdn_IP]:

files:
 scenarios/ox-connector/install_ox8.sh /root/

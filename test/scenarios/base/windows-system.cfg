[Global]
logfile: autotest.log

kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_extra_label: [ENV:WINDOWS_kvm_ucsversion]
kvm_architecture: amd64
kvm_dhcp: true

# Proxmox settings
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_bridge: [ENV:PROXMOX_BRIDGE]
proxmox_vcpus: 2
proxmox_memory: 4G
proxmox_disk_size: 30G
proxmox_description: windows-system-[ENV:WINDOWS_kvm_ucsversion]
proxmox_user: [ENV:KVM_USER]

[os]
windows: true
kvm_operating_system: Windows
kvm_template: [ENV:WINDOWS_kvm_template]
kvm_ucsversion: [ENV:WINDOWS_kvm_ucsversion]
proxmox_template: template-win11-winrm-admin
command1:
 LOCAL : remmina -c rdp://Administrator@[os_IP]

# to setup a test env in EC2 with a public IP address 63.34.234.105
# start with
# errata_update=public ./utils/start-test.sh scenarios/base/ucs-primary-member-samba-PUBLIC.cfg
[EC2Tags]
usecase: manual tests

[Global]
logfile: autotest.log

# ec2 settings
build_server: EC2
ec2_region: eu-west-1
ec2_ami: [ENV:CURRENT_AMI]
ec2_instance_type: t2.medium
ec2_partition_size: 30
#ec2_subnet_id: subnet-f452539c
#ec2_security_group: sg-4170962e
ec2_keypair: tech
ec2_keypair_file: ~/ec2/keys/tech.pem
ec2_subnet_id: subnet-0c8e0b6088ba000b2
ec2_security_group: sg-0a1d13f72a563f257

recover: 2

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 SCOPE=[ENV:SCOPE]

[master]
ec2_elastic_ip: eipalloc-0f54ab5f198dca64d
profile:
 hostname="master"
 domainname="AutoTest091.test"
 windows/domain="AUTOTEST091"
 ldap/base="dc=AutoTest091,dc=test"
 root_password="[ENV:RANDOM_UCS_ROOT_PASSWORD]"
 locale/default="de_DE.UTF-8:UTF-8"
 packages_install="univention-s4-connector univention-samba4"
 packages_remove=""
 server/role="domaincontroller_master"
command1:
 . utils.sh && basic_setup
 . utils.sh && add_extra_apt_scope
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && rotate_logfiles
 . utils.sh && jenkins_updates
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils.sh && run_setup_join
 . utils.sh && assert_join
 . utils.sh && import_license
command2:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/


[member]
ec2_ssh_proxy_host: [master_IP]
profile:
 hostname=member
 domainname="AutoTest091.test"
 windows/domain=AUTOTEST091
 server/role="memberserver"
 root_password="[ENV:RANDOM_UCS_ROOT_PASSWORD]"
 locale/default="de_DE.UTF-8:UTF-8"
 packages_install="univention-samba"
 ldap/base="dc=AutoTest091,dc=test"
 locale/default="de_DE.UTF-8:UTF-8"
 nameserver=[master_IP]
command1:
 . utils.sh && basic_setup
 . utils.sh && add_extra_apt_scope
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && rotate_logfiles
 ASYNC . utils.sh && jenkins_updates
command2:
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils.sh && run_setup_join_on_non_master
 . utils.sh && assert_join
command3:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/

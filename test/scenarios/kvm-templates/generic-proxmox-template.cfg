[Global]
# Create the generic Proxmox template: the unjoined base other Proxmox scenarios
# clone, counterpart of KVM's `generic-unsafe`.
#
# The ISO install generic-kvm-template.cfg drives over VNC is done by the packer
# pipeline in packer-scripts/ instead, which publishes
# `template-ucs-appliance-<version>-generic`. This scenario clones that, brings it
# to the current errata level, applies the knut network settings and republishes
# it as `template-generic-<ucsver>`.
#
# Run with `ucs-proxmox-create` (build_server: Proxmox). Connection details
# (proxmox_host, api token, bridge, pool) come from ~/.ucs-ec2-tools.json.
logfile: generic-proxmox-template.log
build_server: Proxmox

proxmox_template: [ENV:PROXMOX_TEMPLATE]
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_user: [ENV:KVM_USER]
proxmox_memory: 2G
proxmox_vcpus: 2
# The packer base is 5G, too tight for the errata update; consumers of this
# template ask for 20G upwards.
proxmox_disk_size: 20G
proxmox_description: Generic unjoined UCS template built from [ENV:PROXMOX_TEMPLATE]

recover: 2

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 IS_SETUP_JOB=true

[proxmox-template]
command1:
 # update
 . utils.sh && basic_setup
 . utils.sh && add_tech_key_authorized_keys
 ucr set repository/online=yes repository/online/server='[ENV:REPOSITORY_SERVER]'
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 ucr set repository/online/server='[ENV:REPOSITORY_SERVER]' update/secure_apt=yes updater/identify="UCS (Proxmox)"
 ucr set nameserver1='[ENV:DNS_FORWARDER]' timeserver='ntp.knut.univention.de burst'
 usermod -p "$(mkpasswd -H sha-512 univention)" root
 # free disk space
 univention-prune-kernels
 apt-get clean
 fstrim -a -v
 . utils.sh && create_version_file_tmp_ucsver "[ENV:TESTING]"
 GET /tmp/ucs.ver ucs_[SELF].ver
 # stop the instance; drops the DHCP lease, which would otherwise put every clone
 # on the address this VM was built with
 . base_appliance.sh && appliance_poweroff
 SSH_DISCONNECT
 # create template
 SOURCE ucs_[SELF].ver
 LOCAL ucs-proxmox-template-create -d --vmid [SELF_VMID] --template-name "template-generic-[ucsver]" --replace
command2:
 LOCAL rm -f ucs_[SELF].ver

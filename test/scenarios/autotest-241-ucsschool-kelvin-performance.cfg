[Global]
logfile: autotest.log
parallel: false
extra_label: [ENV:TARGET_VERSION]-ucsschool-multiserver-large-Kelvin-Performance

openstack_flavor_name: UNIVENTION-4V-8-100s

# Proxmox settings
# The pre-joined UCS@school multiserver-large templates are built by the
# ucsschool-images repository; the sections pick the matching one.
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_vcpus: 4
proxmox_memory: 8G
proxmox_disk_size: 100G
proxmox_description: [ENV:TARGET_VERSION]-ucsschool-multiserver-large-Kelvin-Performance
proxmox_user: [ENV:KVM_USER]

recover: 5

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 TARGET_VERSION=[ENV:UCS_VERSION]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 JENKINS_WS=[ENV:JOB_URL]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 UCSSCHOOL_RELEASE=[ENV:UCSSCHOOL_RELEASE]
 JOB_NAME=[ENV:JOB_NAME]
 KVM_BUILD_SERVER=[ENV:KVM_BUILD_SERVER]
 UCS_TEST_APPCENTER=[ENV:UCS_TEST_APPCENTER]
 UCS_ENV_LOCUST_WORKER=1
 KELVIN_VERSION=[ENV:KELVIN_VERSION]
 KELVIN_BRANCH=[ENV:KELVIN_BRANCH]

[primary]
openstack_image_name: [ENV:TARGET_VERSION]-dev-ucsschool-multiserver-large-primary
proxmox_template: template-ucsschool-[ENV:TARGET_VERSION]-multiserver-large-primary
command1:
 . utils.sh && online_fsresize
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
command2:
 echo "$(hostname --fqdn): $(hostname --ip-address)"
 # app setup
 . utils-school.sh && udm_rest_setup
 . utils.sh && switch_app_center
 . utils.sh && set_env_variables_from_env_file "/root/secrets.env"
 # kelvin requires the provisioning service in the domain
 . utils.sh && set_administrator_dn_for_ucs_test; set_administrator_password_for_ucs_test univention
 . utils.sh && install_apps provisioning-service
 . utils-school.sh && install_kelvin_in_version
 . utils-school.sh && set_udm_properties_for_kelvin_api_tests
 . utils-school.sh && kelvin_setup
 . utils.sh && run_join_scripts univention
 . utils-school.sh && performance_test_settings
 # CPU-count will be checked by the performance test running on the backup node
 . utils-school.sh && register_cpu_count
command3:
 # start sysstat
 . utils-school.sh && start_system_stats_collection [SELF]
command4:
 # run tests
command5:
 # get log files
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
 . utils-school.sh && end_system_stats_collection [SELF]
 LOCAL mkdir -p results || true
 LOCAL utils/utils-local.sh fetch-files "root@[SELF_IP]" '/var/log/perfstats/*' results
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/
 ~/ec2/ram/ram.secrets /etc/

[backup]
openstack_image_name: [ENV:TARGET_VERSION]-dev-ucsschool-multiserver-large-backup
proxmox_template: template-ucsschool-[ENV:TARGET_VERSION]-multiserver-large-backup
command1:
 . utils.sh && online_fsresize
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [primary_IP]
command2:
 echo "$(hostname --fqdn): $(hostname --ip-address)"
 # test setup
 . utils.sh && activate_ucsschool_repositories
 . utils.sh && jenkins_updates
 . utils-school.sh && performance_test_settings
 . utils-school.sh && performance_test_setup
 . utils-school.sh && performance_test_checkout_build_install "$KELVIN_BRANCH"
command3:
 # start sysstat
 . utils-school.sh && start_system_stats_collection [SELF]
command4:
 # stop listener, so we won't be effected by changes in the primaries LDAP
 systemctl stop univention-directory-listener.service
 # run tests
 . utils.sh && run_tests -s ucsschool-kelvin-performance
command5:
 # get log files
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
 . utils-school.sh && end_system_stats_collection [SELF]
 LOCAL test "$UCS_TEST_RUN" = "false" || mkdir -p results
 LOCAL test "$UCS_TEST_RUN" = "false" || utils/utils-local.sh fetch-files "root@[SELF_IP]" '/var/lib/ucs-test-ucsschool-kelvin-performance/results/*' results
 LOCAL test "$UCS_TEST_RUN" = "false" || utils/utils-local.sh fetch-files "root@[SELF_IP]" '/var/log/perfstats/*' results

[Global]
# Create Proxmox templates for joined UCS systems (one per server role).
#
# Each VM is cloned from the unjoined base template
# (template-ucs-appliance-<version>-generic, built by the packer pipeline in
# packer-scripts),
# joined into the domain, and then converted into a role template with
# `ucs-proxmox-template-create` (run via LOCAL, analogous to OpenStack's
# upload-image-when-shut-down.sh).
#
# Run with `ucs-proxmox-create` (build_server: Proxmox). Connection details
# (proxmox_host, api token, bridge, pool) come from ~/.ucs-ec2-tools.json.
logfile: autotest.log
parallel: true
recover: 4
build_server: Proxmox

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 IS_SETUP_JOB=true

proxmox_template: template-ucs-appliance-[ENV:UCS_VERSION]-generic
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_vcpus: 4
proxmox_memory: 4G
proxmox_description: Joined UCS template built from template-ucs-appliance-[ENV:UCS_VERSION]-generic
proxmox_user: [ENV:KVM_USER]

[primary]
profile:
 hostname="primary"
 domainname="ucs.test"
 windows/domain="UCS"
 ldap/base="dc=ucs,dc=test"
 root_password="univention"
 locale/default="en_US.UTF-8:UTF-8"
 locale="en_US.UTF-8:UTF-8 de_DE.UTF-8:UTF-8"
 packages_install=""
 packages_remove=""
 server/role="domaincontroller_master"
command1:
 . utils.sh && basic_setup
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && upgrade_to_latest_patchlevel
 if [ "[ENV:TESTING]" = "true" ]; then . utils.sh && RELEASE_UPDATE=testing ERRATA_UPDATE=testing jenkins_updates; fi
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 univention-prune-kernels
 apt-get clean
 . utils.sh && rotate_logfiles
 . utils.sh && run_setup_join
 . utils.sh && import_license
 . utils.sh && assert_join
command2:
 # join additional servers
command3:
 # free disk space
 apt-get clean
 fstrim -a -v
 rm -f /root/.ssh/known_hosts
 # convert the shut-down VM into the primary role template
 LOCAL ucs-proxmox-template-create -d --vmid [SELF_VMID] --template-name "template-ucs-joined-[ENV:TARGET_VERSION]-primary" --replace
command4:
files:
 ~/ec2/license/license.secret /etc/


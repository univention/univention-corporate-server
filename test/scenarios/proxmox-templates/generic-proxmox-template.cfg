[Global]
logfile: generic-proxmox-template.log
build_server: Proxmox
docker_image: gitregistry.knut.univention.de/univention/infrastructure/vnc-automate@sha256:91cc27e2dbaf0aec45956de2fed73fcbe8f5a5c9430188c9669fe5f6742e97cc

proxmox_create: true
proxmox_iso: [ENV:SOURCE_ISO]
proxmox_vcpus: 4
proxmox_memory: 6144
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_tags: template, template-[ENV:UCS_VERSION]
proxmox_disk_size: 50G
extra_label: template-generic-[ENV:UCS_VERSION]
proxmox_description: Generic UCS [ENV:UCS_VERSION] template
proxmox_user: build
proxmox_copy_files: false
proxmox_ssh_init_connect: false

recover: 2

[kvm-template]
command1:
 # installation via VNC, then bootstrap qemu-guest-agent so the IP can be discovered
 LOCAL utils/installation_test/vnc-install-ucs.py --proxmox-node [ENV:PROXMOX_NODE] --proxmox-vmid [kvm-template_VMID] --language deu --role applianceLVM --fqdn base.ucs.test
 LOCAL utils/installation_test/bootstrap-guest-agent.py --proxmox-node [ENV:PROXMOX_NODE] --proxmox-vmid [kvm-template_VMID] --language deu --repository-server [ENV:REPOSITORY_SERVER]
 COPY_FILES
 . utils.sh && add_tech_key_authorized_keys
 ucr set repository/online=yes repository/online/server='[ENV:REPOSITORY_SERVER]'
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 # appliance
 . base_appliance.sh && setup_appliance
 . base_appliance.sh && appliance_cleanup
 ucr set repository/online/server='[ENV:REPOSITORY_SERVER]' nameserver1=10.208.1.16 nameserver2=10.208.1.15 timeserver='ntp.knut.univention.de burst' update/secure_apt=yes updater/identify="UCS (KVM)"
 # WORKAROUND, drop this again once the two DHCP servers share their leases:
 # both serve this network without a common lease database, so they hand the same
 # address to different VMs. Ignore one of them so only a single server is ever
 # authoritative.
 # This has to be dhclient's own `reject` rather than a firewall rule: dhclient
 # receives DHCP on an AF_PACKET socket while the interface is still
 # unconfigured, and packet-socket taps run before netfilter's INPUT chain, so an
 # iptables DROP never sees the OFFER.
 # UCS's template for dhclient.conf appends an `include` for
 # /etc/dhcp/dhclient.conf.local whenever that file exists, so the statement
 # survives a `ucr commit`. The grep fails the build if that include support ever
 # goes away -- a silently ignored reject would bring the duplicate addresses
 # back without any other symptom.
 echo 'reject 10.150.4.3;' > /etc/dhcp/dhclient.conf.local
 ucr commit /etc/dhcp/dhclient.conf
 grep -q 'dhclient.conf.local' /etc/dhcp/dhclient.conf
 usermod -p "$(mkpasswd -H sha-512 univention)" root
 echo "ucsver=@%@version/version@%@-@%@version/patchlevel@%@+$(if [ '[ENV:TESTING]' = true ];then date +'%Y-%m-%d';else echo e'@%@version/erratalevel@%@';fi)" | ucr filter >/tmp/ucs.ver
 GET /tmp/ucs.ver ucs_[SELF].ver
 # stop the instance
 . base_appliance.sh && appliance_poweroff
 SSH_DISCONNECT
 LOCAL /usr/bin/ucs-proxmox-template-create --vmid [kvm-template_VMID] --template-name template-generic-[ENV:UCS_VERSION]-kvm --replace -dd
command2:
 LOCAL rm -f ucs_[SELF].ver

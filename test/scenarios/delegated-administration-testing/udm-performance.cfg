[Global]
logfile: autotest.log
kvm_extra_label: [ENV:JOB_BASE_NAME]-[ENV:SETUP]-[ENV:UCS_VERSION]
kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_operating_system: Others
kvm_template: [ENV:KVM_TEMPLATE]
kvm_ucsversion: [ENV:UCS_VERSION]
kvm_architecture: amd64
kvm_memory: 8GiB
kvm_vcpus: [ENV:KVM_CPUS]
kvm_dhcp: true

# Openstack settings
openstack_flavor_name: UNIVENTION-2V-8-20s
build_server: Openstack

recover: 6

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 SCOPE=[ENV:SCOPE]
 BASE_SCOPE=ucs-dev/delegated-administration
 GUARDIAN=[ENV:GUARDIAN]
 GUARDIAN_LOCAL=[ENV:GUARDIAN_LOCAL]
 GUARDIAN_SERVICE=[ENV:GUARDIAN_SERVICE]

[primary]
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-performance-20.000-primary
kvm_template: ucs-joined-master
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined "[ENV:primary_IP]"
 . utils.sh && import_license 10000
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && add_extra_apt_scope
command2:
 ASYNC . utils.sh && jenkins_updates
command3:
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
command4:
 # install tests
 ASYNC . utils.sh && install_from_errata_test ucs-test
command5:
 if "$GUARDIAN_LOCAL"; then /usr/share/ucs-test/42_authorization/create-delegated-administration-setup.py; fi
command6:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/

[locust]
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-performance-20.000-managed
kvm_template: ucs-joined-member
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [primary_IP]
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && add_extra_apt_scope
command2:
 ASYNC . utils.sh && jenkins_updates
command3:
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
command4:
 # tests
 ASYNC . utils.sh && install_from_errata_test ucs-test
command5:
 # run test
 . utils.sh && run_udm_performance_tests
command6:
 # fetch results
 . utils.sh && prepare_results
 mkdir -p /root/locust
 if [ENV:UCS_TEST_RUN]; then cp /usr/share/ucs-test/92_udm-rest-performance/*.{html,csv} /root/locust/; fi
 if [ENV:UCS_TEST_RUN]; then cp -rf /usr/share/ucs-test/92_udm-rest-performance/jmeter /root/locust/; fi
 LOCAL utils/utils-local.sh fetch-files "root@[SELF_IP]" '/root/locust' .
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/

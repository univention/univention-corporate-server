[Global]
logfile: autotest.log
kvm_extra_label: [ENV:VM_PREFIX]-primary-univention-guardian-[ENV:UCS_VERSION]
kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_operating_system: Others
kvm_template: [ENV:KVM_TEMPLATE]
kvm_ucsversion: [ENV:UCS_VERSION]
kvm_architecture: amd64
kvm_memory: 8GiB
kvm_vcpus: [ENV:KVM_CPUS]
kvm_dhcp: true

# Openstack settings
openstack_flavor_name: UNIVENTION-2V-8-20s

# Proxmox settings
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_bridge: [ENV:PROXMOX_BRIDGE]
proxmox_vcpus: 2
proxmox_memory: 8G
proxmox_disk_size: 30G
proxmox_description: [ENV:VM_PREFIX]-primary-with-guardian-[ENV:UCS_VERSION]
proxmox_user: [ENV:KVM_USER]

recover: 7

environment:
 KEYCLOAK_APPVERSION=26.8.1-nubus1
 UCS_VERSION=[ENV:UCS_VERSION]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 SCOPE=[ENV:SCOPE]
 UCS_TEST_SECTIONS=[ENV:UCS_TEST_SECTIONS]


[primary]
kvm_template: ucs-joined-master
proxmox_template: template-ucs-joined-[ENV:TARGET_VERSION]-primary
openstack_image_name: [ENV:OPENSTACK_IMAGE_VERSION]-dev-primary-joined
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined "[ENV:primary_IP]"
 . utils.sh && import_license 10000
 . utils.sh && add_tech_key_authorized_keys
command2:
 . utils.sh && add_extra_apt_scope
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 LOCAL sleep 120
 . utils.sh && wait_for_reboot
 udm computers/domaincontroller_backup remove --remove_referring --dn "cn=2backup,cn=dc,cn=computers,$(ucr get ldap/base)"
 udm computers/memberserver remove --remove_referring --dn "cn=member,cn=memberserver,cn=computers,$(ucr get ldap/base)"
 udm computers/domaincontroller_slave remove --remove_referring --dn "cn=slave,cn=dc,cn=computers,$(ucr get ldap/base)" || true
 udm computers/domaincontroller_slave remove --remove_referring --dn "cn=replica,cn=dc,cn=computers,$(ucr get ldap/base)" || true
 udm computers/domaincontroller_backup remove --remove_referring --dn "cn=backup,cn=dc,cn=computers,$(ucr get ldap/base)"
command3:
 . utils.sh && assert_join
 . utils.sh && assert_version "[ENV:TARGET_VERSION]"
 #. utils-keycloak.sh && install_upgrade_keycloak
 #. utils.sh && configure_umc_keycloak
 # install guardian
 univention-install -y univention-guardian-server
 # FIXME: hack to install image with ldap dn support, remove once merged
 sed -i  's/image: artifacts.*/image: gitregistry.knut.univention.de\/univention\/dev\/projects\/authorization-engine\/cerbos\/cerbos:branch-fbotner-1-ldap-dn/' /usr/share/univention-guardian-server/docker-compose.yaml
 service univention-guardian-server restart
command4:
 . utils.sh && assert_join
command5:
 # install tests
 ASYNC . utils.sh && install_from_errata_test ucs-test
command6:
 /usr/share/ucs-test/42_authorization/create-delegated-administration-setup.py
 # run test
 . utils.sh && run_tests ${UCS_TEST_SECTIONS:--s checks -s udm -s udm-rest -s umc -s authorization} "$@"
command7:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 ~/ec2/scripts/activate-errata-test-scope.sh /root/
 ~/ec2/license/license.secret /etc/

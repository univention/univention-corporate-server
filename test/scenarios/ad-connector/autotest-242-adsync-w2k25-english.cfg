[EC2Tags]
usecase: dev-jenkins-ucs5.2

[Global]
logfile: autotest-242-adsync-w2k25-english.cfg

# ec2 settings
build_server: EC2
ec2_region: eu-west-1
ec2_ami: [ENV:CURRENT_AMI]
ec2_instance_type: m5.large
ec2_volume_type: gp3
ec2_subnet_id: subnet-f452539c
ec2_security_group: sg-4170962e
ec2_keypair: tech
ec2_keypair_file: ~/ec2/keys/tech.pem

recover: 2

environment:
 UCS_VERSION=[ENV:UCS_VERSION]
 RELEASE_UPDATE=[ENV:RELEASE_UPDATE]
 ERRATA_UPDATE=[ENV:ERRATA_UPDATE]
 TARGET_VERSION=[ENV:TARGET_VERSION]
 JENKINS_WS=[ENV:JOB_URL]
 UCS_TEST_RUN=[ENV:UCS_TEST_RUN]

[master242]
profile:
 hostname="master242"
 domainname="autotest242.test"
 windows/domain="AUTOTEST242"
 ldap/base="dc=autotest242,dc=test"
 root_password="univention"
 locale/default="de_DE.UTF-8:UTF-8"
 packages_install="univention-ad-connector"
 packages_remove=""
 server/role="domaincontroller_master"
command1:
 . utils.sh && winrm_config "utotest242win.test" "[ENV:win2k25242_PASSWORD]" "Administrator" "[ENV:win2k25242_IP]"
 . utils.sh && basic_setup
 . utils.sh && rotate_logfiles
 . utils.sh && run_setup_join
 . utils.sh && assert_join
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 . utils.sh && wait_for_reboot
 . utils.sh && import_license
 . utils-keycloak.sh && install_upgrade_keycloak
 . utils.sh && configure_umc_keycloak
 . utils.sh && set_administrator_password_for_ucs_test univention
 . utils.sh && ucs-winrm run-ps --cmd ipconfig
 . utils.sh && ucs-winrm promote-ad --forestmode WIN2016 --domainmode WIN2016
 # activate SSL CA on AD required for w2k25
 . utils.sh && ucs-winrm certification-authority --catype EnterpriseRootCa --cert_file 'c:\adcert.cer'
 cd /opt && smbclient  -U Administrator%'[ENV:win2k25242_PASSWORD]' //[win2k25242_IP]/C\$ -c 'get adcert.cer'
 openssl x509 -inform DER -in /opt/adcert.cer -outform PEM -out /opt/adcert.pem
 . utils.sh && ucs-winrm run-ps --cmd "certutil -pulse"
 # Setup AD Connection between UCS and AD
 ./ad-join.py -H "$(hostname -f)" -u Administrator -p univention -D [win2k25242_IP] -A Administrator -P '[ENV:win2k25242_PASSWORD]' -S
 . utils.sh && assert_adconnector_configuration
 # activate SSL (not tls)
 ucr set connector/ad/ldap/ssl=false
 ucr set connector/ad/ldap/ldaps=true
 ucr set connector/ad/ldap/port=636
 ucr set connector/ad/ldap/certificate=/opt/adcert.pem
 service univention-ad-connector restart
 # tests
 . utils.sh && install_ucs_test
 . utils.sh && run_adconnector_tests
command2:
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP]
files:
 utils/utils.sh /root/
 utils/ad-join.py /root/
 ~/ec2/license/license.secret /etc/
 ~/ec2/scripts/activate-errata-test-scope.sh /root/

[win2k25242]
windows: true
ec2_ami_name: Windows_Server-2025-English-Full-Base-*
ec2_instance_type: t3.medium
